<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>💊 MedAlarm - Alarme de Remédios</title>
  <style>
    :root {
      --primary: #2563eb;
      --success: #059669;
      --danger: #dc2626;
      --warning: #f59e0b;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #1e293b;
      --text-light: #64748b;
      --border: #e2e8f0;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      padding: 16px;
      color: var(--text);
    }
    
    .app-container { max-width: 520px; margin: 0 auto; }
    
    .header { text-align: center; margin-bottom: 20px; }
    .logo { font-size: 36px; }
    .app-title { font-size: 26px; font-weight: 800; color: var(--text); }
    .app-subtitle { font-size: 13px; color: var(--text-light); font-weight: 500; }
    
    .clock-card {
      background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 16px;
      text-align: center;
      border: 1px solid #334155;
    }
    
    .clock-date { color: #94a3b8; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
    .clock-time { color: #34d399; font-size: 60px; font-weight: 700; font-family: 'Courier New', monospace; letter-spacing: 2px; }
    .clock-seconds { color: #f87171; font-size: 16px; font-weight: 600; }
    
    .alarm-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(220, 38, 38, 0.95);
      z-index: 9999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: alarmPulse 0.5s infinite;
      cursor: pointer;
    }
    
    .alarm-overlay.active { display: flex; }
    
    @keyframes alarmPulse {
      0%, 100% { background: rgba(220, 38, 38, 0.95); }
      50% { background: rgba(234, 179, 8, 0.95); }
    }
    
    .alarm-icon { font-size: 80px; margin-bottom: 16px; }
    .alarm-title { color: white; font-size: 32px; font-weight: 800; text-align: center; margin-bottom: 8px; }
    .alarm-medicine { color: white; font-size: 22px; font-weight: 600; text-align: center; margin-bottom: 24px; }
    .alarm-time-badge { background: white; color: #dc2626; padding: 12px 32px; border-radius: 50px; font-size: 20px; font-weight: 700; margin-bottom: 24px; }
    .alarm-dismiss { background: white; color: #dc2626; border: none; padding: 16px 48px; border-radius: 50px; font-size: 20px; font-weight: 700; cursor: pointer; }
    
    .status-bar {
      padding: 12px 16px;
      border-radius: 12px;
      margin-bottom: 16px;
      font-weight: 600;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .status-ok { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
    .status-warn { background: #fffbeb; color: #92400e; border: 1px solid #fde68a; }
    .status-error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    
    .card {
      background: var(--card);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      border: 1px solid var(--border);
    }
    
    .card-header {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .form-group { margin-bottom: 14px; }
    
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
    }
    
    .form-input {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid var(--border);
      border-radius: 12px;
      font-size: 15px;
      font-weight: 500;
      outline: none;
      transition: all 0.2s;
      background: #f8fafc;
    }
    
    .form-input:focus { border-color: var(--primary); background: white; }
    
    .mode-selector { display: flex; gap: 8px; margin-bottom: 14px; }
    
    .mode-btn {
      flex: 1;
      padding: 10px;
      border: 2px solid var(--border);
      background: #f8fafc;
      border-radius: 12px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }
    
    .mode-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
    
    .interval-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 14px;
    }
    
    .interval-chip {
      padding: 10px 8px;
      border: 2px solid var(--border);
      background: #f8fafc;
      border-radius: 12px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }
    
    .interval-chip.active { background: var(--success); color: white; border-color: var(--success); }
    
    .sound-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 14px; }
    
    .sound-chip {
      padding: 12px 8px;
      border: 2px solid var(--border);
      background: #f8fafc;
      border-radius: 12px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }
    
    .sound-chip.active { background: var(--warning); border-color: #f59e0b; color: #1e293b; }
    
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 8px;
    }
    
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: var(--primary); color: white; }
    .btn-success { background: var(--success); color: white; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-warning { background: var(--warning); color: #1e293b; }
    .btn-outline { background: white; color: var(--primary); border: 2px solid var(--primary); }
    
    .reminder-item {
      background: #f8fafc;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .reminder-item:active { background: #f1f5f9; }
    .reminder-info h4 { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
    
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      margin-right: 4px;
      margin-top: 2px;
    }
    
    .badge-time { background: #dbeafe; color: #1e40af; }
    .badge-interval { background: #d1fae5; color: #065f46; }
    .badge-sound { background: #fef3c7; color: #92400e; }
    
    .reminder-actions { display: flex; gap: 4px; }
    
    .btn-icon {
      padding: 8px 10px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }
    
    .btn-icon-edit { background: #fef3c7; color: #92400e; }
    .btn-icon-delete { background: #fee2e2; color: #991b1b; }
    
    .panel { display: none; }
    .panel.visible { display: block; }
    
    .preview-box {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 14px;
      font-size: 13px;
    }
    
    .time-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
    .time-chip { background: var(--primary); color: white; padding: 4px 10px; border-radius: 15px; font-size: 11px; font-weight: 600; }
    
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    
    .modal-backdrop.visible { display: flex; }
    
    .modal {
      background: white;
      border-radius: 20px;
      padding: 24px;
      width: 90%;
      max-width: 400px;
      max-height: 80vh;
      overflow-y: auto;
    }
    
    .modal h3 { font-size: 20px; font-weight: 700; margin-bottom: 16px; text-align: center; }
    
    .detail-row {
      display: flex;
      justify-content: space-between;
      padding: 10px;
      background: #f8fafc;
      border-radius: 8px;
      margin-bottom: 6px;
    }
    
    .detail-label { font-weight: 600; color: var(--text-light); font-size: 13px; }
    .detail-value { font-weight: 700; color: var(--text); font-size: 14px; }
    
    .history-list { max-height: 150px; overflow-y: auto; }
    
    .history-item {
      display: flex;
      justify-content: space-between;
      padding: 8px;
      background: #f8fafc;
      border-radius: 6px;
      margin-bottom: 4px;
      font-size: 12px;
    }
    
    .empty-state { text-align: center; color: var(--text-light); padding: 20px; font-size: 14px; }
  </style>
</head>
<body>

<div class="app-container">
  <div class="header">
    <div class="logo">💊</div>
    <div class="app-title">MedAlarm</div>
    <div class="app-subtitle">Alarme Inteligente de Remédios</div>
  </div>
  
  <div class="clock-card">
    <div class="clock-date" id="clockDate"></div>
    <div class="clock-time" id="clockTime"></div>
    <div class="clock-seconds" id="clockSeconds"></div>
  </div>
  
  <div class="alarm-overlay" id="alarmOverlay" onclick="stopAlarm()">
    <div class="alarm-icon">🚨</div>
    <div class="alarm-title">HORA DO REMÉDIO!</div>
    <div class="alarm-medicine" id="alarmMedName"></div>
    <div class="alarm-time-badge" id="alarmMedTime"></div>
    <button class="alarm-dismiss" onclick="event.stopPropagation(); stopAlarm();">🔕 DESLIGAR</button>
  </div>
  
  <div class="status-bar status-warn" id="statusBar">⏳ Inicializando...</div>
  
  <!-- ADICIONAR REMÉDIO -->
  <div class="card">
    <div class="card-header">📋 Novo Lembrete</div>
    
    <div class="form-group">
      <label class="form-label">Nome do Remédio</label>
      <input type="text" class="form-input" id="medName" placeholder="Ex: Dipirona 500mg" autocomplete="off">
    </div>
    
    <label class="form-label">Modo do Alarme</label>
    <div class="mode-selector">
      <button class="mode-btn active" id="modeFixedBtn" onclick="setMode('fixed')">🕒 Horário Fixo</button>
      <button class="mode-btn" id="modeIntervalBtn" onclick="setMode('interval')">🔁 Por Intervalo</button>
    </div>
    
    <div class="panel visible" id="panelFixed">
      <div class="form-group">
        <label class="form-label">Horário do Alarme</label>
        <input type="time" class="form-input" id="timeFixed">
      </div>
    </div>
    
    <div class="panel" id="panelInterval">
      <div class="form-group">
        <label class="form-label">Horário de Início</label>
        <input type="time" class="form-input" id="timeStart" onchange="updatePreview()">
      </div>
      
      <label class="form-label">Repetir a Cada</label>
      <div class="interval-grid">
        <button class="interval-chip" onclick="setIntervalVal(4, this)">4 horas</button>
        <button class="interval-chip" onclick="setIntervalVal(6, this)">6 horas</button>
        <button class="interval-chip" onclick="setIntervalVal(7, this)">7 horas</button>
        <button class="interval-chip active" onclick="setIntervalVal(8, this)">8 horas</button>
        <button class="interval-chip" onclick="setIntervalVal(12, this)">12 horas</button>
        <button class="interval-chip" onclick="setIntervalVal(24, this)">24 horas</button>
      </div>
      
      <div class="preview-box" id="previewBox" style="display:none;">
        <strong>📅 Horários do dia:</strong>
        <div class="time-chips" id="previewChips"></div>
      </div>
    </div>
    
    <label class="form-label">Som do Alarme</label>
    <div class="sound-grid">
      <button class="sound-chip active" onclick="setSound('beep', this)">🔔 Beep</button>
      <button class="sound-chip" onclick="setSound('melody', this)">🎵 Melodia</button>
      <button class="sound-chip" onclick="setSound('siren', this)">🚨 Sirene</button>
      <button class="sound-chip" onclick="setSound('bell', this)">🛎️ Sino</button>
      <button class="sound-chip" onclick="setSound('vibrate', this)">📳 Vibração</button>
      <button class="sound-chip" onclick="setSound('electronic', this)">🎹 Eletrônico</button>
    </div>
    
    <button class="btn btn-outline" onclick="testSound()">🔊 Testar Som</button>
    <button class="btn btn-success" onclick="addReminder()">➕ Salvar Lembrete</button>
  </div>
  
  <!-- LISTA DE LEMBRETES -->
  <div class="card">
    <div class="card-header">📌 Seus Lembretes <span id="countBadge" style="color:var(--primary);">(0)</span></div>
    <div id="remindersList"><div class="empty-state">Nenhum lembrete salvo</div></div>
  </div>
  
  <button class="btn btn-danger" onclick="stopAlarm()">🔕 Parar Alarme</button>
  <button class="btn btn-outline" onclick="testAlarm()">🧪 Testar Alarme</button>
  <button class="btn btn-warning" onclick="clearAll()">🗑️ Remover Todos</button>
</div>

<!-- MODAL -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <h3 id="modalTitle">📋 Detalhes</h3>
    <div id="modalContent"></div>
    <button class="btn btn-primary" onclick="closeModal()" style="margin-top:16px;">✅ Fechar</button>
  </div>
</div>

<script>
// ============ RELÓGIO ============
function updateClock() {
  const now = new Date();
  const days = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
  const months = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  
  document.getElementById('clockDate').textContent = 
    `${days[now.getDay()]}, ${now.getDate().toString().padStart(2,'0')} de ${months[now.getMonth()]} de ${now.getFullYear()}`;
  document.getElementById('clockTime').textContent = 
    `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
  document.getElementById('clockSeconds').textContent = now.getSeconds().toString().padStart(2,'0');
  
  if (now.getSeconds() === 0) checkAlarms();
}
setInterval(updateClock, 1000);
updateClock();

// ============ DADOS ============
let reminders = [];
let history = [];
let currentMode = 'fixed';
let currentInterval = 8;
let currentSound = 'beep';
let alarmActive = false;
let alarmTimer = null;
let audioCtx = null;
let currentAlarm = null;
let firedAlarms = {};

// CARREGAR DADOS SALVOS
try {
  reminders = JSON.parse(localStorage.getItem('medalarm_reminders') || '[]');
  history = JSON.parse(localStorage.getItem('medalarm_history') || '[]');
} catch(e) {
  reminders = [];
  history = [];
}

function saveData() {
  localStorage.setItem('medalarm_reminders', JSON.stringify(reminders));
  localStorage.setItem('medalarm_history', JSON.stringify(history));
}

// ============ SOM ============
function getAudioCtx() {
  if (!audioCtx || audioCtx.state === 'closed') audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playSound(type) {
  try {
    const ctx = getAudioCtx();
    const t = ctx.currentTime;
    const beep = (f, s, d, w='square', v=0.35) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type = w; o.frequency.value = f;
      g.gain.setValueAtTime(v, s); g.gain.exponentialRampToValueAtTime(0.001, s+d);
      o.start(s); o.stop(s+d);
    };
    
    if (type === 'beep') { for(let i=0;i<5;i++) beep(880, t+i*0.3, 0.25); }
    else if (type === 'melody') { beep(523,t,0.2,'sine',0.4); beep(659,t+0.2,0.2,'sine',0.4); beep(784,t+0.4,0.3,'sine',0.4); }
    else if (type === 'siren') { for(let i=0;i<10;i++) beep(400+i*80, t+i*0.1, 0.15, 'sawtooth',0.4); }
    else if (type === 'bell') { beep(1200,t,0.15,'triangle',0.6); beep(1000,t+0.15,0.2,'triangle',0.5); }
    else if (type === 'vibrate') { beep(150,t,0.8,'square',0.9); if(navigator.vibrate) navigator.vibrate([300,100,300]); }
    else if (type === 'electronic') { beep(440,t,0.1); beep(660,t+0.1,0.1); beep(880,t+0.2,0.2); }
  } catch(e) {}
}

// ============ ALARME ============
function triggerAlarm(name, time) {
  if (alarmActive) return;
  alarmActive = true;
  currentAlarm = { name, time };
  
  document.getElementById('alarmOverlay').classList.add('active');
  document.getElementById('alarmMedName').textContent = `💊 ${name}`;
  document.getElementById('alarmMedTime').textContent = `⏰ ${time}`;
  
  function ring() { playSound(currentSound); }
  ring();
  alarmTimer = setInterval(ring, 3000);
  
  if (navigator.vibrate) navigator.vibrate([500,200,500,200,500]);
  
  if ('Notification' in window && Notification.permission === 'granted') {
    new Notification('💊 HORA DO REMÉDIO!', {
      body: `${name} - ${time}`,
      icon: '💊',
      vibrate: [500,200,500],
      requireInteraction: true,
      tag: 'medalarm'
    });
  }
  
  if ('wakeLock' in navigator) navigator.wakeLock.request('screen').catch(()=>{});
  
  const now = new Date();
  history.push({
    name,
    date: now.toLocaleDateString('pt-BR'),
    time: now.toLocaleTimeString('pt-BR'),
    timestamp: Date.now()
  });
  if (history.length > 200) history = history.slice(-200);
  saveData();
  
  setStatus(`🚨 Alarme: ${name}`, 'error');
  
  setTimeout(() => { if (alarmActive) stopAlarm(); }, 120000);
}

function stopAlarm() {
  alarmActive = false;
  currentAlarm = null;
  if (alarmTimer) { clearInterval(alarmTimer); alarmTimer = null; }
  if (navigator.vibrate) navigator.vibrate(0);
  document.getElementById('alarmOverlay').classList.remove('active');
  setStatus('✅ Pronto', 'ok');
}

// ============ VERIFICAR ALARMES ============
function checkAlarms() {
  if (alarmActive) return;
  
  const now = new Date();
  const currentTime = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
  const today = now.toDateString();
  const currentMinutes = now.getHours() * 60 + now.getMinutes();
  
  for (const rem of reminders) {
    let shouldFire = false;
    let fireTime = '';
    
    if (!rem.interval) {
      if (rem.time === currentTime) { shouldFire = true; fireTime = rem.time; }
    } else {
      const [h, m] = rem.startTime.split(':').map(Number);
      const startMin = h * 60 + m;
      let diff = currentMinutes - startMin;
      if (diff < 0) diff += 1440;
      if (diff % (rem.interval * 60) === 0) { shouldFire = true; fireTime = currentTime; }
    }
    
    if (shouldFire) {
      const key = `${rem.id}-${today}-${fireTime}`;
      if (!firedAlarms[key]) {
        firedAlarms[key] = true;
        triggerAlarm(rem.name, fireTime);
        break;
      }
    }
  }
  
  for (const key in firedAlarms) {
    if (!key.includes(today)) delete firedAlarms[key];
  }
}

// ============ ADICIONAR ============
function addReminder() {
  const name = document.getElementById('medName').value.trim();
  if (!name) return alert('Digite o nome do remédio!');
  
  let time, startTime = null, interval = null;
  
  if (currentMode === 'fixed') {
    time = document.getElementById('timeFixed').value;
    if (!time) return alert('Selecione o horário!');
  } else {
    startTime = document.getElementById('timeStart').value;
    if (!startTime) return alert('Selecione o horário de início!');
    time = startTime;
    interval = currentInterval;
  }
  
  reminders.push({
    id: Date.now(),
    name,
    time,
    startTime,
    interval,
    sound: currentSound,
    created: new Date().toISOString()
  });
  
  saveData();
  renderList();
  document.getElementById('medName').value = '';
  setStatus('✅ Lembrete salvo!', 'ok');
}

// ============ LISTA ============
function renderList() {
  const div = document.getElementById('remindersList');
  document.getElementById('countBadge').textContent = `(${reminders.length})`;
  
  if (!reminders.length) {
    div.innerHTML = '<div class="empty-state">Nenhum lembrete salvo</div>';
    return;
  }
  
  reminders.sort((a,b) => a.time.localeCompare(b.time));
  
  div.innerHTML = reminders.map(r => `
    <div class="reminder-item" onclick="showDetails(${r.id})">
      <div class="reminder-info">
        <h4>💊 ${r.name} ${r.interval ? '🔁' : ''}</h4>
        ${r.interval ? 
          `<span class="badge badge-time">🕐 ${r.startTime}</span><span class="badge badge-interval">⏱️ ${r.interval}h</span>` :
          `<span class="badge badge-time">🕒 ${r.time}</span>`
        }
        <span class="badge badge-sound">🔊 ${r.sound}</span>
      </div>
      <div class="reminder-actions">
        <button class="btn-icon btn-icon-edit" onclick="event.stopPropagation(); editReminder(${r.id})">✏️</button>
        <button class="btn-icon btn-icon-delete" onclick="event.stopPropagation(); deleteReminder(${r.id})">🗑️</button>
      </div>
    </div>
  `).join('');
}

// ============ DETALHES ============
function showDetails(id) {
  const r = reminders.find(x => x.id === id);
  if (!r) return;
  
  const today = new Date().toLocaleDateString('pt-BR');
  const medHistory = history.filter(h => h.name === r.name).slice(-10).reverse();
  const todayCount = history.filter(h => h.name === r.name && h.date === today).length;
  
  let scheduleHtml = '';
  if (r.interval && r.startTime) {
    const [h, m] = r.startTime.split(':').map(Number);
    const times = [];
    const total = Math.floor(1440 / (r.interval * 60));
    for (let i = 0; i < total; i++) {
      const mins = (h*60+m + i*r.interval*60) % 1440;
      times.push(`${Math.floor(mins/60).toString().padStart(2,'0')}:${(mins%60).toString().padStart(2,'0')}`);
    }
    scheduleHtml = `
      <div class="detail-row"><span class="detail-label">⏱️ Intervalo</span><span class="detail-value">A cada ${r.interval}h</span></div>
      <div style="background:#eff6ff; padding:12px; border-radius:8px; margin-bottom:8px;">
        <strong style="font-size:13px;">📅 ${total} alarmes/dia:</strong>
        <div class="time-chips" style="margin-top:6px;">${times.map(t => `<span class="time-chip">${t}</span>`).join('')}</div>
      </div>
    `;
  }
  
  document.getElementById('modalTitle').textContent = '📋 ' + r.name;
  document.getElementById('modalContent').innerHTML = `
    <div class="detail-row"><span class="detail-label">💊 Remédio</span><span class="detail-value">${r.name}</span></div>
    <div class="detail-row"><span class="detail-label">🕐 Horário</span><span class="detail-value">${r.interval ? r.startTime + ' (início)' : r.time}</span></div>
    ${scheduleHtml}
    <div class="detail-row"><span class="detail-label">🔊 Som</span><span class="detail-value">${r.sound}</span></div>
    <div class="detail-row"><span class="detail-label">📊 Hoje</span><span class="detail-value">${todayCount}x</span></div>
    ${medHistory.length ? `
      <div style="margin-top:12px;"><strong style="font-size:13px;">📜 Histórico</strong>
        <div class="history-list">${medHistory.map(h => `<div class="history-item"><span>${h.date}</span><span>${h.time}</span></div>`).join('')}</div>
      </div>
    ` : ''}
  `;
  document.getElementById('modalBackdrop').classList.add('visible');
}

function closeModal() { document.getElementById('modalBackdrop').classList.remove('visible'); }

// ============ EDITAR / REMOVER ============
function editReminder(id) {
  const r = reminders.find(x => x.id === id);
  if (!r) return;
  const val = prompt('Novo horário (HH:MM):', r.startTime || r.time);
  if (val && /^\d{2}:\d{2}$/.test(val)) {
    if (r.interval) { r.startTime = val; r.time = val; }
    else r.time = val;
    saveData();
    renderList();
    setStatus('✅ Atualizado!', 'ok');
  }
}

function deleteReminder(id) {
  if (confirm('Remover este lembrete?')) {
    reminders = reminders.filter(r => r.id !== id);
    saveData();
    renderList();
    setStatus('🗑️ Removido', 'warn');
  }
}

function clearAll() {
  if (reminders.length && confirm('Remover TODOS os lembretes?')) {
    reminders = [];
    saveData();
    renderList();
    stopAlarm();
    setStatus('🗑️ Todos removidos', 'warn');
  }
}

// ============ INTERFACE ============
function setMode(m) {
  currentMode = m;
  document.getElementById('modeFixedBtn').classList.toggle('active', m==='fixed');
  document.getElementById('modeIntervalBtn').classList.toggle('active', m==='interval');
  document.getElementById('panelFixed').classList.toggle('visible', m==='fixed');
  document.getElementById('panelInterval').classList.toggle('visible', m==='interval');
}

function setIntervalVal(h, btn) {
  currentInterval = h;
  document.querySelectorAll('.interval-chip').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  updatePreview();
}

function setSound(s, btn) {
  currentSound = s;
  document.querySelectorAll('.sound-chip').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function updatePreview() {
  const start = document.getElementById('timeStart').value;
  if (start && currentInterval) {
    const [h, m] = start.split(':').map(Number);
    const total = Math.floor(1440 / (currentInterval * 60));
    const times = [];
    for (let i = 0; i < total; i++) {
      const mins = (h*60+m + i*currentInterval*60) % 1440;
      times.push(`${Math.floor(mins/60).toString().padStart(2,'0')}:${(mins%60).toString().padStart(2,'0')}`);
    }
    document.getElementById('previewBox').style.display = 'block';
    document.getElementById('previewChips').innerHTML = times.map(t => `<span class="time-chip">${t}</span>`).join('');
  }
}

function testSound() { playSound(currentSound); }

function testAlarm() {
  if (Notification.permission !== 'granted') Notification.requestPermission();
  triggerAlarm('🧪 Teste', new Date().toLocaleTimeString('pt-BR'));
}

function setStatus(msg, type) {
  const bar = document.getElementById('statusBar');
  bar.textContent = msg;
  bar.className = 'status-bar status-' + type;
}

// ============ INICIAR ============
function init() {
  const now = new Date();
  const currentTime = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
  document.getElementById('timeFixed').value = currentTime;
  document.getElementById('timeStart').value = currentTime;
  
  Notification.requestPermission();
  renderList();
  
  document.getElementById('modalBackdrop').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });
  
  if ('wakeLock' in navigator) {
    setInterval(() => { navigator.wakeLock.request('screen').catch(()=>{}); }, 60000);
  }
  
  setStatus(`✅ ${reminders.length} lembrete(s) carregado(s)`, 'ok');
}

init();
</script>
</body>
