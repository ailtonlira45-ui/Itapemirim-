<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>💊 Alarme Remédio | Tela Bloqueada</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(150deg, #e8f4ff 0%, #d0e3ff 100%);
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .app-container {
      max-width: 580px;
      width: 100%;
      background: #ffffff;
      border-radius: 42px;
      box-shadow: 0 30px 60px rgba(0, 40, 80, 0.25);
      padding: 24px 20px 30px;
    }
    h1 { font-size: 1.9rem; font-weight: 800; color: #063251; margin-bottom: 10px; text-align: center; }
    .alert-box {
      background: #fff3cd;
      border: 2px solid #ffc107;
      padding: 12px;
      border-radius: 15px;
      margin-bottom: 15px;
      font-weight: 600;
      text-align: center;
    }
    .card { background: #f4f9ff; border-radius: 28px; padding: 18px; margin-bottom: 20px; border: 1px solid #d2e6fa; }
    label { font-weight: 700; font-size: 0.85rem; color: #0c4260; display: block; margin-bottom: 6px; }
    input { width: 100%; background: white; border: 1.5px solid #c5ddf7; border-radius: 18px; padding: 12px 14px; font-size: 1rem; outline: none; margin-bottom: 12px; }
    .mode-selector { display: flex; gap: 10px; margin-bottom: 14px; }
    .mode-btn { flex: 1; background: #e3f0fc; border: 2px solid transparent; border-radius: 30px; padding: 10px; font-weight: 700; cursor: pointer; text-align: center; transition: 0.3s; }
    .mode-btn.active { background: #0f7bc2; color: white; }
    .chip-container { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .chip { background: white; border: 1.5px solid #b9d6f5; border-radius: 24px; padding: 8px 16px; font-weight: 700; cursor: pointer; transition: 0.3s; }
    .chip.selected { background: #1e81c4; color: white; }
    .btn { background: linear-gradient(135deg, #1e8ad4, #0c558b); border: none; border-radius: 40px; padding: 14px 20px; font-weight: 700; color: white; cursor: pointer; width: 100%; margin-top: 8px; font-size: 1rem; }
    .btn-green { background: linear-gradient(135deg, #38a169, #2f855a); }
    .btn-red { background: linear-gradient(135deg, #e53e3e, #c53030); }
    .btn-yellow { background: linear-gradient(135deg, #d69e2e, #b7791f); }
    .list-item { background: white; border-radius: 20px; padding: 14px; margin-bottom: 10px; border: 1px solid #daeafa; display: flex; justify-content: space-between; align-items: center; }
    .icon-btn { background: #f0f6fe; border: 1px solid #cde2fa; border-radius: 20px; padding: 6px 12px; cursor: pointer; font-weight: 600; margin-left: 4px; }
    .status { padding: 8px 12px; border-radius: 15px; margin: 10px 0; font-size: 0.85rem; text-align: center; }
    .status.success { background: #c6f6d5; color: #22543d; }
    .status.error { background: #fed7d7; color: #742a2a; }
  </style>
</head>
<body>
<div class="app-container">
  <h1>💊 Alarme de Remédio</h1>
  
  <div id="statusMsg" class="status">🔄 Carregando...</div>

  <div class="card">
    <label>📋 Nome do remédio</label>
    <input type="text" id="medName" placeholder="Ex: Dipirona 500mg" autocomplete="off">

    <div class="mode-selector">
      <button id="modeFixed" class="mode-btn active">🕒 Horário fixo</button>
      <button id="modeInterval" class="mode-btn">🔁 Intervalo</button>
    </div>

    <div id="panelFixed">
      <label>⏰ Horário do alarme</label>
      <input type="time" id="medTime">
    </div>
    
    <div id="panelInterval" style="display:none;">
      <label>⏳ Tomar a cada:</label>
      <div class="chip-container">
        <span class="chip" data-h="4">4h</span>
        <span class="chip" data-h="6">6h</span>
        <span class="chip selected" data-h="8">8h</span>
        <span class="chip" data-h="12">12h</span>
        <span class="chip" data-h="24">24h</span>
      </div>
    </div>

    <button class="btn" id="addBtn">➕ Adicionar lembrete</button>
    <button class="btn btn-yellow" id="testBtn">🔊 Testar alarme</button>
  </div>

  <div>
    <h3>📌 Lembretes ativos: <span id="countBadge">0</span></h3>
    <div id="listContainer"><div style="color:#7b98b3; padding:20px;">Nenhum lembrete.</div></div>
    <button class="btn btn-red" id="stopAlarmBtn">🔕 Parar alarme</button>
    <button class="btn btn-green" id="installBtn" style="display:none;">📲 Instalar App</button>
  </div>
</div>

<script>
  // Registrar Service Worker
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js')
      .then(reg => {
        console.log('✅ Service Worker registrado!');
        document.getElementById('statusMsg').className = 'status success';
        document.getElementById('statusMsg').textContent = '✅ Alarme funcionando - Pode desligar a tela';
        
        // Solicitar permissão de notificação
        if (Notification.permission === 'default') {
          Notification.requestPermission();
        }
      })
      .catch(err => {
        console.error('❌ Service Worker falhou:', err);
        document.getElementById('statusMsg').className = 'status error';
        document.getElementById('statusMsg').textContent = '❌ Erro no Service Worker';
      });
  }

  let reminders = JSON.parse(localStorage.getItem('alarms') || '[]');
  let alarmCheckInterval = null;

  function saveReminders() {
    localStorage.setItem('alarms', JSON.stringify(reminders));
  }

  function renderList() {
    const container = document.getElementById('listContainer');
    const badge = document.getElementById('countBadge');
    
    if (!reminders.length) {
      container.innerHTML = '<div style="color:#7b98b3; padding:20px;">Nenhum lembrete.</div>';
      badge.textContent = '0';
      return;
    }
    
    badge.textContent = reminders.length;
    container.innerHTML = reminders.map(r => `
      <div class="list-item">
        <div>
          <strong>💊 ${r.name}</strong><br>
          <small>🕒 ${r.time}</small>
        </div>
        <div>
          <button class="icon-btn" onclick="editReminder('${r.id}')">✏️</button>
          <button class="icon-btn" onclick="deleteReminder('${r.id}')" style="color:red;">🗑️</button>
        </div>
      </div>
    `).join('');
  }

  function editReminder(id) {
    const rem = reminders.find(r => r.id === id);
    if (!rem) return;
    const newTime = prompt('Novo horário (HH:MM):', rem.time);
    if (newTime && /^\d{2}:\d{2}$/.test(newTime)) {
      rem.time = newTime;
      saveReminders();
      renderList();
    }
  }

  function deleteReminder(id) {
    reminders = reminders.filter(r => r.id !== id);
    saveReminders();
    renderList();
  }

  // Enviar alarmes para o Service Worker
  function sendAlarmsToSW() {
    if (navigator.serviceWorker && navigator.serviceWorker.controller) {
      navigator.serviceWorker.controller.postMessage({
        type: 'UPDATE_ALARMS',
        alarms: reminders
      });
    }
  }

  document.getElementById('addBtn').addEventListener('click', () => {
    const name = document.getElementById('medName').value.trim();
    if (!name) return alert('Digite o nome do remédio');
    
    let time;
    const mode = document.getElementById('modeFixed').classList.contains('active') ? 'fixed' : 'interval';
    
    if (mode === 'fixed') {
      time = document.getElementById('medTime').value;
      if (!time) return alert('Selecione o horário');
    } else {
      const interval = parseInt(document.querySelector('.chip.selected').dataset.h);
      const d = new Date();
      d.setMinutes(d.getMinutes() + interval * 60);
      time = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    }
    
    reminders.push({
      id: Date.now().toString(),
      name,
      time,
      created: new Date().toISOString()
    });
    
    saveReminders();
    renderList();
    sendAlarmsToSW();
    document.getElementById('medName').value = '';
  });

  document.getElementById('testBtn').addEventListener('click', () => {
    if (navigator.serviceWorker && navigator.serviceWorker.controller) {
      navigator.serviceWorker.controller.postMessage({
        type: 'TEST_ALARM'
      });
      alert('🔊 Alarme de teste enviado! Verifique as notificações.');
    } else {
      alert('❌ Service Worker não está pronto. Recarregue a página.');
    }
  });

  document.getElementById('stopAlarmBtn').addEventListener('click', () => {
    if (navigator.serviceWorker && navigator.serviceWorker.controller) {
      navigator.serviceWorker.controller.postMessage({
        type: 'STOP_ALARM'
      });
    }
    alert('✅ Alarme parado!');
  });

  // Modo
  document.getElementById('modeFixed').addEventListener('click', function() {
    this.classList.add('active');
    document.getElementById('modeInterval').classList.remove('active');
    document.getElementById('panelFixed').style.display = 'block';
    document.getElementById('panelInterval').style.display = 'none';
  });

  document.getElementById('modeInterval').addEventListener('click', function() {
    this.classList.add('active');
    document.getElementById('modeFixed').classList.remove('active');
    document.getElementById('panelFixed').style.display = 'none';
    document.getElementById('panelInterval').style.display = 'block';
  });

  // Chips
  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', function() {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
      this.classList.add('selected');
    });
  });

  // Inicializar
  renderList();
  document.getElementById('medTime').value = `${String(new Date().getHours()).padStart(2, '0')}:${String(new Date().getMinutes()).padStart(2, '0')}`;
  
  // Enviar alarmes para SW a cada 30 segundos
  setInterval(sendAlarmsToSW, 30000);
  sendAlarmsToSW();

  // Instalar PWA
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    window.deferredPrompt = e;
    document.getElementById('installBtn').style.display = 'block';
  });

  document.getElementById('installBtn').addEventListener('click', () => {
    if (window.deferredPrompt) {
      window.deferredPrompt.prompt();
    }
  });
</script>
</body>
</html>
