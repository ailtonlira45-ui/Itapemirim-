<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Multi-Flex Marcopolo G7 1200 – Alinhado</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', 'Arial', sans-serif;
            padding: 12px;
            background-image: 
                repeating-linear-gradient(45deg, transparent, transparent 2px, rgba(255,255,255,0.01) 2px, rgba(255,255,255,0.01) 4px),
                radial-gradient(circle at 50% 50%, #1a1a1a 0%, #050505 100%);
        }

        .container-principal {
            background: linear-gradient(180deg, #262626 0%, #181818 100%);
            border-radius: 28px;
            padding: 20px 18px 18px 18px;
            box-shadow: 
                0 0 0 2px #3a3a3a,
                0 0 0 6px #1a1a1a,
                0 0 0 10px #353535,
                0 15px 40px rgba(0,0,0,0.8),
                inset 0 1px 2px rgba(255,255,255,0.08);
            position: relative;
            width: fit-content;
            max-width: 100%;
            margin: auto;
            transition: all 0.3s ease;
        }

        .container-principal::before {
            content: '';
            position: absolute;
            top: -5px;
            left: 20px;
            right: 20px;
            height: 6px;
            background: linear-gradient(90deg, #b5874a, #f0b060, #b5874a);
            border-radius: 0 0 8px 8px;
            box-shadow: 0 0 12px rgba(240,176,96,0.6);
            z-index: 2;
        }

        .parafuso {
            position: absolute;
            width: 14px;
            height: 14px;
            background: radial-gradient(circle at 30% 30%, #888, #333);
            border-radius: 50%;
            box-shadow: inset 0 1px 2px rgba(255,255,255,0.4), 0 2px 4px black;
            z-index: 3;
        }
        .parafuso::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #111;
            box-shadow: inset 0 0 3px black;
        }
        .p1 { top: 12px; left: 14px; }
        .p2 { top: 12px; right: 14px; }
        .p3 { bottom: 12px; left: 14px; }
        .p4 { bottom: 12px; right: 14px; }

        .cabecalho {
            text-align: center;
            margin-bottom: 18px;
            padding-bottom: 10px;
            border-bottom: 1px solid #3a3a3a;
            position: relative;
            z-index: 1;
        }
        .cabecalho::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 20%;
            width: 60%;
            height: 1px;
            background: linear-gradient(90deg, transparent, #f0b060, transparent);
        }
        .marca-marcopolo {
            color: #f0b060;
            font-size: 1.1em;
            font-weight: 800;
            letter-spacing: 6px;
            text-transform: uppercase;
            text-shadow: 0 0 8px rgba(240,176,96,0.5);
        }
        .modelo-g7 {
            color: #ddd;
            font-size: 1.8em;
            font-weight: 300;
            letter-spacing: 4px;
            font-style: italic;
        }
        .modelo-g7 span {
            color: #f0b060;
            font-weight: 700;
        }
        .versao-multi-flex {
            color: #888;
            font-size: 0.7em;
            letter-spacing: 2px;
            margin-top: 2px;
            text-transform: uppercase;
        }

        .painel-multiflex {
            background: #151515;
            border-radius: 16px;
            padding: 16px;
            border: 2px solid #2d2d2d;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.8), 0 4px 8px rgba(0,0,0,0.6);
            margin-bottom: 16px;
            position: relative;
            z-index: 1;
        }

        .grid-multiflex {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 12px;
            justify-content: center;
            transition: all 0.3s ease;
        }

        /* Botão estilo ORIGINAL Marcopolo G7 1200 */
        .botao-multiflex {
            aspect-ratio: 1 / 1;
            width: 100%;
            border-radius: 18px;
            border: 2px solid #3a3a3a;
            background: linear-gradient(165deg, #2a2a2a 0%, #111 100%);
            color: #999;
            font-size: clamp(28px, 6vw, 42px);
            cursor: pointer;
            transition: all 0.12s ease;
            box-shadow: 
                inset 0 2px 4px rgba(255,255,255,0.06),
                0 5px 10px rgba(0,0,0,0.7),
                0 1px 0 rgba(255,255,255,0.08);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
            gap: 4px;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            outline: none;
            padding: 6px;
            min-width: 0;
            min-height: 0;
        }

        .botao-multiflex::before {
            content: '';
            position: absolute;
            top: 6px;
            left: 6px;
            right: 6px;
            height: 35%;
            background: linear-gradient(180deg, rgba(255,255,255,0.1) 0%, transparent 100%);
            border-radius: 10px;
            pointer-events: none;
        }

        .botao-multiflex::after {
            content: '';
            position: absolute;
            bottom: 10px;
            right: 10px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #1a1a1a;
            border: 1px solid #444;
            box-shadow: inset 0 0 4px black;
            transition: all 0.2s ease;
        }

        .botao-multiflex .icone-svg {
            width: 48%;
            height: 48%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s ease;
        }
        .botao-multiflex .label-botao {
            font-size: clamp(7px, 1.4vw, 9px);
            color: #aaa;
            letter-spacing: 1px;
            transition: color 0.2s;
            text-align: center;
            line-height: 1;
        }

        .botao-multiflex.pressionado {
            color: #ff8800;
            border-color: #ff8800;
            background: linear-gradient(165deg, #3d2e1a 0%, #1a140e 100%);
            box-shadow: 0 0 30px rgba(255,136,0,0.8), 0 0 45px rgba(255,136,0,0.4), inset 0 0 15px rgba(255,136,0,0.3);
            transform: scale(0.96);
            z-index: 2;
        }
        .botao-multiflex.pressionado::after {
            background: #ff8800;
            box-shadow: 0 0 12px #ff8800, 0 0 20px rgba(255,136,0,0.9);
            border-color: #ff8800;
        }
        .botao-multiflex.pressionado .label-botao {
            color: #ffaa00;
        }

        .botao-multiflex.ativo {
            color: #00dd66;
            border-color: #00aa44;
            background: linear-gradient(165deg, #1f3124 0%, #0d1a10 100%);
            box-shadow: 0 0 20px rgba(0,220,100,0.7), 0 0 35px rgba(0,220,100,0.3), inset 0 0 15px rgba(0,220,100,0.2);
            z-index: 2;
        }
        .botao-multiflex.ativo::after {
            background: #00dd66;
            box-shadow: 0 0 12px #00dd66, 0 0 20px rgba(0,220,100,0.9);
            border-color: #00dd66;
        }
        .botao-multiflex.ativo .label-botao {
            color: #00dd66;
        }

        .botao-multiflex.estagio1 { color: #00ccff; }
        .botao-multiflex.estagio1.ativo::after { background: #00ccff; box-shadow: 0 0 12px #00ccff; border-color: #00ccff; }
        .botao-multiflex.estagio2 { color: #00aaff; }
        .botao-multiflex.estagio2.ativo::after { background: #00aaff; box-shadow: 0 0 12px #00aaff; border-color: #00aaff; }
        .botao-multiflex.estagio3 { color: #0088ff; }
        .botao-multiflex.estagio3.ativo::after { background: #0088ff; box-shadow: 0 0 12px #0088ff; border-color: #0088ff; }

        .status-painel {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: #0e0e0e;
            border-radius: 10px;
            padding: 12px 8px;
            border: 1px solid #2a2a2a;
            box-shadow: inset 0 1px 4px black;
            margin-top: 10px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .indicador-led {
            text-align: center;
            color: #aaa;
            font-size: 0.65em;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .led {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #2a2a2a;
            box-shadow: inset 0 0 5px black;
            transition: all 0.2s ease;
        }
        .led.power {
            background: #00dd66;
            box-shadow: 0 0 10px #00dd66, 0 0 20px rgba(0,220,100,0.7);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.35; }
        }

        .rodape-marcopolo {
            text-align: center;
            margin-top: 12px;
            color: #555;
            font-size: 0.7em;
            letter-spacing: 2px;
            text-transform: uppercase;
            z-index: 1;
            position: relative;
        }
        .rodape-marcopolo span {
            color: #f0b060;
        }

        @media (orientation: landscape) {
            body {
                padding: 8px;
            }
            .container-principal {
                max-width: 100vw;
                width: 100%;
                border-radius: 24px;
                padding: 16px 12px 12px 12px;
            }
            .painel-multiflex {
                padding: 12px;
            }
            .grid-multiflex {
                grid-template-columns: repeat(11, 1fr);
                grid-template-rows: 1fr;
                gap: 8px;
            }
            .botao-multiflex {
                font-size: clamp(24px, 4vw, 36px);
            }
            .botao-multiflex .icone-svg {
                width: 50%;
                height: 50%;
            }
        }
    </style>
</head>
<body>
    <div class="container-principal">
        <div class="parafuso p1"></div>
        <div class="parafuso p2"></div>
        <div class="parafuso p3"></div>
        <div class="parafuso p4"></div>

        <div class="cabecalho">
            <div class="marca-marcopolo">MARCOPOLO</div>
            <div class="modelo-g7">G7 <span>1200</span></div>
            <div class="versao-multi-flex">Iluminação Inteligente</div>
        </div>

        <div class="painel-multiflex">
            <div class="grid-multiflex" id="gridBotoes">
                <!-- Linha 1 -->
                <button class="botao-multiflex" data-funcao="salao"><div class="icone-svg"><svg viewBox="0 0 48 48"><line x1="24" y1="8" x2="24" y2="14" stroke="currentColor" stroke-width="2.5"/><circle cx="14" cy="22" r="5.5" fill="none" stroke="currentColor" stroke-width="2.5"/><circle cx="24" cy="24" r="5.5" fill="none" stroke="currentColor" stroke-width="2.5"/><circle cx="34" cy="22" r="5.5" fill="none" stroke="currentColor" stroke-width="2.5"/></svg></div><span class="label-botao">Salão</span></button>
                <button class="botao-multiflex" data-funcao="noturna"><div class="icone-svg"><svg viewBox="0 0 48 48"><path d="M24 6 Q14 16 14 28 Q14 38 24 42 Q34 38 34 28 Q34 16 24 6 Z" fill="none" stroke="currentColor" stroke-width="2.5"/><circle cx="20" cy="22" r="2.5" fill="currentColor"/></svg></div><span class="label-botao">Noturna</span></button>
                <button class="botao-multiflex" data-funcao="neblina"><div class="icone-svg"><svg viewBox="0 0 48 48"><circle cx="24" cy="21" r="9" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M16 29 Q21 33 24 29 Q27 33 32 29" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><line x1="24" y1="12" x2="24" y2="8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg></div><span class="label-botao">Neblina</span></button>
                <button class="botao-multiflex" data-funcao="degrau"><div class="icone-svg"><svg viewBox="0 0 48 48"><rect x="10" y="32" width="28" height="4" rx="2" fill="none" stroke="currentColor" stroke-width="2.5"/><rect x="14" y="24" width="20" height="4" rx="2" fill="none" stroke="currentColor" stroke-width="2.5"/><rect x="18" y="16" width="12" height="4" rx="2" fill="none" stroke="currentColor" stroke-width="2.5"/><circle cx="20" cy="16" r="2" fill="currentColor"/><circle cx="16" cy="24" r="2" fill="currentColor"/></svg></div><span class="label-botao">Degrau</span></button>
                <button class="botao-multiflex" data-funcao="poltronas"><div class="icone-svg"><svg viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="2.5"><rect x="10" y="14" width="10" height="14" rx="2"/><rect x="28" y="14" width="10" height="14" rx="2"/><path d="M13 14 L13 10 M35 14 L35 10" stroke-linecap="round"/><line x1="19" y1="12" x2="29" y2="12"/><circle cx="15" cy="20" r="1.5" fill="currentColor"/><circle cx="33" cy="20" r="1.5" fill="currentColor"/></g></svg></div><span class="label-botao">Poltronas</span></button>

                <!-- Linha 2 -->
                <button class="botao-multiflex" data-funcao="ventilador"><div class="icone-svg" id="iconeVentilador"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="12" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M24 12 L24 17 M24 31 L24 36 M12 24 L17 24 M31 24 L36 24" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><text x="24" y="22" text-anchor="middle" fill="currentColor" font-size="13" font-weight="bold" id="numVent">1</text></svg></div><span class="label-botao" id="labelVent">Vent 1</span></button>
                <button class="botao-multiflex" data-funcao="wifi"><div class="icone-svg"><svg viewBox="0 0 48 48"><path d="M12 20 Q24 8 36 20" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/><path d="M17 26 Q24 18 31 26" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/><path d="M22 32 Q24 28 26 32" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/><circle cx="24" cy="38" r="2.5" fill="currentColor"/></svg></div><span class="label-botao">Wi-Fi</span></button>
                <button class="botao-multiflex" data-funcao="banheiro"><div class="icone-svg"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="13" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M24 11 L24 16 M24 32 L24 37 M11 24 L16 24 M32 24 L37 24" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg></div><span class="label-botao">Banheiro</span></button>
                <button class="botao-multiflex" data-funcao="usb"><div class="icone-svg"><svg viewBox="0 0 48 48"><rect x="16" y="14" width="16" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="2.5"/><rect x="21" y="8" width="6" height="6" rx="2" fill="none" stroke="currentColor" stroke-width="2.5"/><line x1="20" y1="19" x2="28" y2="19" stroke="currentColor" stroke-width="2"/><line x1="20" y1="23" x2="28" y2="23" stroke="currentColor" stroke-width="2"/><circle cx="24" cy="28" r="1.8" fill="currentColor"/></svg></div><span class="label-botao">USB</span></button>
                <button class="botao-multiflex" data-funcao="itinerario"><div class="icone-svg"><svg viewBox="0 0 48 48"><rect x="15" y="12" width="18" height="24" rx="2" fill="none" stroke="currentColor" stroke-width="2.5"/><line x1="19" y1="18" x2="29" y2="18" stroke="currentColor" stroke-width="2"/><line x1="19" y1="24" x2="29" y2="24" stroke="currentColor" stroke-width="2"/><circle cx="24" cy="32" r="2" fill="currentColor"/></svg></div><span class="label-botao">Itiner.</span></button>

                <!-- Linha 3 - Monitor centralizado -->
                <button class="botao-multiflex" data-funcao="monitor" style="grid-column: 3 / 4;"><div class="icone-svg"><svg viewBox="0 0 48 48"><rect x="10" y="12" width="28" height="22" rx="2.5" fill="none" stroke="currentColor" stroke-width="2.5"/><line x1="17" y1="34" x2="31" y2="34" stroke="currentColor" stroke-width="2.5"/><line x1="24" y1="34" x2="24" y2="40" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg></div><span class="label-botao">Monitor</span></button>
            </div>
        </div>

        <div class="status-painel">
            <div class="indicador-led"><div class="led power"></div><span>Power</span></div>
            <div class="indicador-led" id="statusLuzes"><div class="led"></div><span>Luzes</span></div>
            <div class="indicador-led" id="statusWiFi"><div class="led"></div><span>Wi-Fi</span></div>
            <div class="indicador-led" id="statusUSB"><div class="led"></div><span>USB</span></div>
            <div class="indicador-led" id="statusVent"><div class="led"></div><span>Vent.</span></div>
        </div>

        <div class="rodape-marcopolo">
            <span>●</span> Marcopolo S.A. <span>●</span> G7 1200 <span>●</span>
        </div>
    </div>

    <script>
        (function() {
            const estadoSistema = {
                salao: false, noturna: false, neblina: false, degrau: false,
                poltronas: false, ventilador: 0, wifi: false, banheiro: false,
                usb: false, itinerario: false, monitor: false
            };

            const mapa = {
                salao:'salao', noturna:'noturna', neblina:'neblina', degrau:'degrau',
                poltronas:'poltronas', ventilador:'ventilador', wifi:'wifi', 
                banheiro:'banheiro', usb:'usb', itinerario:'itinerario', monitor:'monitor'
            };

            function toggle(id, btn) {
                if (id === 'ventilador') {
                    estadoSistema.ventilador = (estadoSistema.ventilador + 1) % 4;
                    const estagio = estadoSistema.ventilador;
                    btn.classList.remove('estagio1', 'estagio2', 'estagio3', 'ativo');
                    const numVent = document.getElementById('numVent');
                    const labelVent = document.getElementById('labelVent');
                    if (estagio === 0) {
                        if (numVent) numVent.textContent = '1';
                        if (labelVent) labelVent.textContent = 'Vent 1';
                    } else if (estagio === 1) {
                        btn.classList.add('ativo', 'estagio1');
                        if (numVent) numVent.textContent = '1';
                        if (labelVent) labelVent.textContent = 'Vent 1';
                    } else if (estagio === 2) {
                        btn.classList.add('ativo', 'estagio2');
                        if (numVent) numVent.textContent = '2';
                        if (labelVent) labelVent.textContent = 'Vent 2';
                    } else if (estagio === 3) {
                        btn.classList.add('ativo', 'estagio3');
                        if (numVent) numVent.textContent = '3';
                        if (labelVent) labelVent.textContent = 'Vent 3';
                    }
                    atualizarLEDs();
                    return estagio > 0;
                }
                const chave = mapa[id];
                if (chave === undefined) return false;
                estadoSistema[chave] = !estadoSistema[chave];
                const novoEstado = estadoSistema[chave];
                atualizarLEDs();
                return novoEstado;
            }

            function atualizarLEDs() {
                const luz = estadoSistema.salao || estadoSistema.noturna || estadoSistema.neblina || estadoSistema.degrau || estadoSistema.poltronas;
                const ledLuz = document.getElementById('statusLuzes').querySelector('.led');
                const ledWifi = document.getElementById('statusWiFi').querySelector('.led');
                const ledUsb = document.getElementById('statusUSB').querySelector('.led');
                const ledVent = document.getElementById('statusVent').querySelector('.led');
                if (luz) { ledLuz.style.background = '#00dd66'; ledLuz.style.boxShadow = '0 0 12px #00dd66, 0 0 20px rgba(0,220,100,0.8)'; }
                else { ledLuz.style.background = '#2a2a2a'; ledLuz.style.boxShadow = 'inset 0 0 5px black'; }
                if (estadoSistema.wifi) { ledWifi.style.background = '#00dd66'; ledWifi.style.boxShadow = '0 0 12px #00dd66, 0 0 20px rgba(0,220,100,0.8)'; }
                else { ledWifi.style.background = '#2a2a2a'; ledWifi.style.boxShadow = 'inset 0 0 5px black'; }
                if (estadoSistema.usb) { ledUsb.style.background = '#00dd66'; ledUsb.style.boxShadow = '0 0 12px #00dd66, 0 0 20px rgba(0,220,100,0.8)'; }
                else { ledUsb.style.background = '#2a2a2a'; ledUsb.style.boxShadow = 'inset 0 0 5px black'; }
                if (estadoSistema.ventilador > 0) { ledVent.style.background = '#00ccff'; ledVent.style.boxShadow = '0 0 12px #00ccff, 0 0 20px rgba(0,204,255,0.8)'; }
                else { ledVent.style.background = '#2a2a2a'; ledVent.style.boxShadow = 'inset 0 0 5px black'; }
            }

            document.querySelectorAll('.botao-multiflex').forEach(btn => {
                const id = btn.dataset.funcao;
                btn.addEventListener('mousedown', e => { e.preventDefault(); btn.classList.add('pressionado'); navigator.vibrate?.(8); });
                btn.addEventListener('mouseup', e => { e.preventDefault(); btn.classList.remove('pressionado'); const s = toggle(id, btn); if (id !== 'ventilador') btn.classList.toggle('ativo', s); });
                btn.addEventListener('mouseleave', () => btn.classList.remove('pressionado'));
                btn.addEventListener('touchstart', e => { e.preventDefault(); btn.classList.add('pressionado'); navigator.vibrate?.(8); });
                btn.addEventListener('touchend', e => { e.preventDefault(); btn.classList.remove('pressionado'); const s = toggle(id, btn); if (id !== 'ventilador') btn.classList.toggle('ativo', s); });
            });

            atualizarLEDs();
        })();
    </script>
</body>
</html>
