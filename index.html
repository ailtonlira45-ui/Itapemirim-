<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>💊 Alarme Remédio</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 15px;
    }
    
    .container {
      max-width: 550px;
      margin: 0 auto;
      background: white;
      border-radius: 25px;
      padding: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }
    
    h1 { text-align: center; color: #333; font-size: 28px; margin-bottom: 5px; }
    .subtitulo { text-align: center; color: #666; font-size: 14px; margin-bottom: 20px; }
    
    /* RELÓGIO DIGITAL */
    .relogio-container {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 15px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    
    .relogio-data {
      color: #8888ff;
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 5px;
    }
    
    .relogio-hora {
      color: #00ff88;
      font-size: 60px;
      font-weight: bold;
      font-family: 'Courier New', monospace;
      text-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
      letter-spacing: 3px;
      margin: 10px 0;
    }
    
    .relogio-segundos {
      color: #ff6b6b;
      font-size: 18px;
      font-weight: bold;
      animation: piscarSegundos 1s infinite;
    }
    
    @keyframes piscarSegundos {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    
    .alerta-alarme {
      background: #ff0000;
      color: white;
      padding: 20px;
      border-radius: 15px;
      text-align: center;
      margin: 15px 0;
      font-size: 22px;
      font-weight: bold;
      display: none;
      animation: piscar 0.5s infinite;
      cursor: pointer;
    }
    
    @keyframes piscar {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    .status-badge {
      padding: 10px;
      border-radius: 10px;
      text-align: center;
      margin: 10px 0;
      font-weight: bold;
      font-size: 14px;
    }
    
    .status-ok { background: #d4edda; color: #155724; }
    .status-erro { background: #f8d7da; color: #721c24; }
    .status-aviso { background: #fff3cd; color: #856404; }
    
    .secao {
      background: #f8f9fa;
      border-radius: 15px;
      padding: 15px;
      margin: 15px 0;
      border: 1px solid #dee2e6;
    }
    
    .secao h3 { color: #495057; margin-bottom: 12px; font-size: 16px; }
    
    label { display: block; color: #495057; font-weight: bold; margin: 8px 0 4px; font-size: 14px; }
    
    input {
      width: 100%;
      padding: 12px;
      border: 2px solid #dee2e6;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 10px;
      outline: none;
      transition: border 0.3s;
    }
    
    input:focus { border-color: #667eea; }
    
    .modo-botoes { display: flex; gap: 8px; margin: 10px 0; }
    
    .modo-btn {
      flex: 1;
      padding: 10px;
      border: 2px solid #667eea;
      background: white;
      color: #667eea;
      border-radius: 25px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 14px;
    }
    
    .modo-btn.ativo { background: #667eea; color: white; }
    
    .intervalos { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin: 10px 0; }
    
    .intervalo-btn {
      padding: 10px 5px;
      border: 2px solid #dee2e6;
      background: white;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 12px;
    }
    
    .intervalo-btn.ativo { background: #28a745; color: white; border-color: #28a745; }
    
    .sons-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
    
    .som-btn {
      padding: 12px 8px;
      border: 2px solid #dee2e6;
      background: white;
      border-radius: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 14px;
    }
    
    .som-btn.ativo { background: #ffc107; border-color: #ff9800; color: #333; }
    
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin: 6px 0;
      transition: transform 0.2s;
    }
    
    .btn:active { transform: scale(0.98); }
    .btn-primario { background: #667eea; color: white; }
    .btn-sucesso { background: #28a745; color: white; }
    .btn-perigo { background: #dc3545; color: white; }
    .btn-alerta { background: #ffc107; color: #333; }
    .btn-info { background: #17a2b8; color: white; }
    
    .lembrete-card {
      background: white;
      border: 2px solid #dee2e6;
      border-radius: 15px;
      padding: 15px;
      margin: 10px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    .lembrete-card:hover { border-color: #667eea; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
    
    .lembrete-info h4 { color: #333; margin-bottom: 5px; }
    
    .lembrete-hora {
      background: #e9ecef;
      padding: 4px 12px;
      border-radius: 15px;
      font-size: 14px;
      color: #495057;
      display: inline-block;
      margin-right: 5px;
      margin-top: 3px;
    }
    
    .lembrete-acoes { display: flex; gap: 5px; }
    
    .btn-pequeno {
      padding: 8px 12px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }
    
    .btn-editar { background: #ffc107; color: #333; }
    .btn-desligar { background: #fd7e14; color: white; }
    .btn-excluir { background: #dc3545; color: white; }
    
    .painel { display: none; }
    .painel.visivel { display: block; }
    
    .proximo-alarme {
      background: #f3e5f5;
      border-left: 4px solid #9c27b0;
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
      font-size: 13px;
      color: #4a148c;
      font-weight: bold;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal-overlay.visivel { display: flex; }

    .modal-resumo {
      background: white;
      border-radius: 20px;
      padding: 25px;
      max-width: 400px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(50px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .modal-resumo h2 { color: #dc3545; text-align: center; margin-bottom: 20px; font-size: 24px; }
    
    .resumo-item {
      background: #f8f9fa;
      padding: 12px;
      border-radius: 10px;
      margin: 8px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .resumo-label { font-weight: bold; color: #495057; }
    .resumo-valor { color: #667eea; font-weight: bold; font-size: 16px; }

    .resumo-destaque {
      background: #ffe6e6;
      border: 2px solid #dc3545;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      margin: 15px 0;
      font-size: 18px;
      font-weight: bold;
      color: #dc3545;
    }

    .btn-fechar-modal {
      background: #667eea;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      margin-top: 15px;
      font-size: 16px;
    }

    .historico-container { max-height: 200px; overflow-y: auto; margin: 10px 0; }

    .historico-item {
      background: #f0f0f0;
      padding: 8px;
      border-radius: 8px;
      margin: 5px 0;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>💊 Alarme Remédio</h1>
  <p class="subtitulo">⏰ Clique no lembrete para ver histórico</p>
  
  <!-- RELÓGIO DIGITAL -->
  <div class="relogio-container">
    <div class="relogio-data" id="relogioData">Carregando...</div>
    <div class="relogio-hora" id="relogioHora">00:00</div>
    <div class="relogio-segundos" id="relogioSegundos">00</div>
  </div>
  
  <div id="alertaAlarme" class="alerta-alarme" onclick="mostrarResumoAlarmeAtivo()">
    🚨 HORA DO REMÉDIO! 🚨
    <br><small style="font-size:14px;">👆 Clique para ver o resumo</small>
  </div>
  
  <div id="statusSistema" class="status-badge status-aviso">
    ⏳ Inicializando sistema...
  </div>

  <div id="modalResumo" class="modal-overlay">
    <div class="modal-resumo">
      <h2 id="modalTitulo">📋 Resumo</h2>
      <div id="conteudoResumo"></div>
      <button class="btn-fechar-modal" onclick="fecharResumo()">✅ Fechar</button>
    </div>
  </div>

  <div class="secao">
    <h3>📋 Adicionar Remédio</h3>
    
    <label>💊 Nome do remédio:</label>
    <input type="text" id="nomeRemedio" placeholder="Ex: Dipirona 500mg">
    
    <label>⏰ Modo do alarme:</label>
    <div class="modo-botoes">
      <button id="modoFixo" class="modo-btn ativo" onclick="mudarModo('fixo')">🕒 Horário Fixo</button>
      <button id="modoIntervalo" class="modo-btn" onclick="mudarModo('intervalo')">🔁 Intervalo</button>
    </div>
    
    <div id="painelFixo" class="painel visivel">
      <label>🕐 Horário do alarme:</label>
      <input type="time" id="horaFixa">
    </div>
    
    <div id="painelIntervalo" class="painel">
      <label>🕐 Horário de início:</label>
      <input type="time" id="horaInicioIntervalo" onchange="atualizarPreviewIntervalo()">
      
      <label>⏱️ Repetir a cada:</label>
      <div class="intervalos">
        <button class="intervalo-btn" onclick="selecionarIntervalo(4, this)">4h</button>
        <button class="intervalo-btn" onclick="selecionarIntervalo(6, this)">6h</button>
        <button class="intervalo-btn ativo" onclick="selecionarIntervalo(8, this)">8h</button>
        <button class="intervalo-btn" onclick="selecionarIntervalo(12, this)">12h</button>
        <button class="intervalo-btn" onclick="selecionarIntervalo(24, this)">24h</button>
      </div>
      
      <div id="infoProximoAlarme" class="proximo-alarme" style="display:none;">
        📅 Próximos alarmes calculados a partir do horário de início
      </div>
    </div>
    
    <label>🔊 Som do alarme:</label>
    <div class="sons-grid">
      <button class="som-btn ativo" onclick="selecionarSom('beep', this)">🔔 Beep</button>
      <button class="som-btn" onclick="selecionarSom('melodia', this)">🎵 Melodia</button>
      <button class="som-btn" onclick="selecionarSom('sirene', this)">🚨 Sirene</button>
      <button class="som-btn" onclick="selecionarSom('sino', this)">🛎️ Sino</button>
      <button class="som-btn" onclick="selecionarSom('vibracao', this)">📳 Vibração</button>
      <button class="som-btn" onclick="selecionarSom('eletronico', this)">🎹 Eletrônico</button>
    </div>
    
    <button class="btn btn-primario" onclick="testarSom()">🔊 Testar Som Selecionado</button>
    <button class="btn btn-sucesso" onclick="adicionarLembrete()">➕ Adicionar Lembrete</button>
  </div>

  <div class="secao">
    <h3>📌 Seus Lembretes <span id="contador" style="color:#667eea;">(0)</span></h3>
    <div id="listaLembretes">
      <p style="color:#999; text-align:center;">Nenhum lembrete adicionado</p>
    </div>
  </div>

  <button class="btn btn-perigo" onclick="pararAlarme()">🔕 Parar Alarme Atual</button>
  <button class="btn btn-info" onclick="testarAlarmeAgora()">🧪 Testar Alarme Agora</button>
  <button class="btn btn-alerta" onclick="limparTodos()">🗑️ Limpar Todos os Lembretes</button>
</div>

<script>
// ============ RELÓGIO DIGITAL ============
function atualizarRelogio() {
  const agora = new Date();
  
  const diasSemana = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
  const meses = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
  
  const diaSemana = diasSemana[agora.getDay()];
  const dia = String(agora.getDate()).padStart(2, '0');
  const mes = meses[agora.getMonth()];
  const ano = agora.getFullYear();
  
  document.getElementById('relogioData').textContent = `${diaSemana}, ${dia} de ${mes} de ${ano}`;
  
  const horas = String(agora.getHours()).padStart(2, '0');
  const minutos = String(agora.getMinutes()).padStart(2, '0');
  const segundos = String(agora.getSeconds()).padStart(2, '0');
  
  document.getElementById('relogioHora').textContent = `${horas}:${minutos}`;
  document.getElementById('relogioSegundos').textContent = segundos;
}

setInterval(atualizarRelogio, 1000);
atualizarRelogio();

// ============ ESTADO DO APP ============
let lembretes = [];
let modoAtual = 'fixo';
let intervaloSelecionado = 8;
let somSelecionado = 'beep';
let alarmeAtivo = false;
let intervaloAlarme = null;
let audioContext = null;
let ultimosAlarmesDisparados = {};
let alarmeAtual = null;
let historicoAlarmes = [];

// ============ CARREGAR DADOS ============
try {
  const dados = localStorage.getItem('app_remedios_completo_v5');
  if (dados) lembretes = JSON.parse(dados);
} catch(e) {
  lembretes = [];
}

try {
  const hist = localStorage.getItem('historico_alarmes_v5');
  if (hist) historicoAlarmes = JSON.parse(hist);
} catch(e) {
  historicoAlarmes = [];
}

// ============ SOM ============
function getAudioContext() {
  if (!audioContext || audioContext.state === 'closed') {
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioContext.state === 'suspended') {
    audioContext.resume();
  }
  return audioContext;
}

function tocarSom(tipo) {
  try {
    const ctx = getAudioContext();
    const now = ctx.currentTime;
    
    function beep(freq, inicio, duracao, tipoOnda = 'square', volume = 0.3) {
      const osc = ctx.createOscillator();
      const ganho = ctx.createGain();
      osc.connect(ganho);
      ganho.connect(ctx.destination);
      osc.type = tipoOnda;
      osc.frequency.value = freq;
      ganho.gain.setValueAtTime(volume, inicio);
      ganho.gain.exponentialRampToValueAtTime(0.001, inicio + duracao);
      osc.start(inicio);
      osc.stop(inicio + duracao);
    }
    
    switch(tipo) {
      case 'beep':
        beep(880, now, 0.3); beep(880, now + 0.4, 0.3); beep(880, now + 0.8, 0.3);
        break;
      case 'melodia':
        beep(523, now, 0.2, 'sine', 0.4); beep(659, now + 0.2, 0.2, 'sine', 0.4);
        beep(784, now + 0.4, 0.3, 'sine', 0.4); beep(1047, now + 0.6, 0.2, 'sine', 0.4);
        break;
      case 'sirene':
        for(let i = 0; i < 8; i++) {
          beep(400 + (i * 100), now + (i * 0.15), 0.15, 'sawtooth', 0.3);
        }
        break;
      case 'sino':
        beep(1200, now, 0.15, 'triangle', 0.5); beep(1000, now + 0.15, 0.2, 'triangle', 0.4);
        beep(800, now + 0.3, 0.25, 'triangle', 0.3);
        break;
      case 'vibracao':
        beep(100, now, 0.5, 'square', 0.8);
        if (navigator.vibrate) navigator.vibrate([300, 100, 300]);
        break;
      case 'eletronico':
        beep(440, now, 0.1, 'square', 0.3); beep(660, now + 0.1, 0.1, 'square', 0.3);
        beep(880, now + 0.2, 0.2, 'square', 0.3); beep(1100, now + 0.3, 0.1, 'square', 0.3);
        break;
    }
  } catch(e) {
    console.log('Erro no som:', e);
  }
}

// ============ NOTIFICAÇÃO ============
function mostrarNotificacao(nome, hora) {
  if ('Notification' in window && Notification.permission === 'granted') {
    new Notification('💊 HORA DO REMÉDIO!', {
      body: `${nome} - ${hora}`,
      icon: '💊',
      badge: '💊',
      vibrate: [500, 200, 500, 200, 500],
      requireInteraction: true,
      silent: false,
      tag: 'alarme-principal'
    });
  }
}

// ============ ALARME ============
function iniciarAlarme(nome, hora, id) {
  if (alarmeAtivo) return;
  
  alarmeAtivo = true;
  alarmeAtual = { id, nome, hora, som: somSelecionado };
  
  const alertaDiv = document.getElementById('alertaAlarme');
  alertaDiv.style.display = 'block';
  alertaDiv.innerHTML = `🚨 ${nome} - ${hora} 🚨<br><small style="font-size:14px;">👆 Clique para ver o resumo completo</small>`;
  
  function dispararAlarme() {
    tocarSom(somSelecionado);
    mostrarNotificacao(nome, hora);
    if (navigator.vibrate) navigator.vibrate([500, 200, 500, 200, 500]);
    if ('wakeLock' in navigator) navigator.wakeLock.request('screen').catch(() => {});
  }
  
  dispararAlarme();
  
  let contador = 0;
  intervaloAlarme = setInterval(() => {
    contador++;
    if (contador >= 24) { pararAlarme(); return; }
    dispararAlarme();
  }, 5000);
  
  // Salvar no histórico
  const agora = new Date();
  historicoAlarmes.push({
    nome: nome,
    data: agora.toLocaleDateString('pt-BR'),
    hora: agora.toLocaleTimeString('pt-BR'),
    timestamp: Date.now()
  });
  if (historicoAlarmes.length > 100) historicoAlarmes = historicoAlarmes.slice(-100);
  localStorage.setItem('historico_alarmes_v5', JSON.stringify(historicoAlarmes));
  
  atualizarStatus('🚨 Alarme ativo: ' + nome, 'status-erro');
}

function pararAlarme() {
  alarmeAtivo = false;
  alarmeAtual = null;
  if (intervaloAlarme) { clearInterval(intervaloAlarme); intervaloAlarme = null; }
  document.getElementById('alertaAlarme').style.display = 'none';
  atualizarStatus('✅ Alarme parado', 'status-ok');
}

// ============ VERIFICAÇÃO DE HORÁRIOS ============
function verificarAlarmes() {
  if (alarmeAtivo) return;
  
  const agora = new Date();
  const horaAtual = String(agora.getHours()).padStart(2, '0') + ':' + 
                    String(agora.getMinutes()).padStart(2, '0');
  const dataAtual = agora.toDateString();
  
  lembretes.forEach(lembrete => {
    // Modo fixo
    if (!lembrete.intervalo) {
      if (lembrete.hora === horaAtual) {
        const chave = lembrete.id + '-' + dataAtual + '-' + horaAtual;
        if (!ultimosAlarmesDisparados[chave]) {
          ultimosAlarmesDisparados[chave] = true;
          iniciarAlarme(lembrete.nome, lembrete.hora, lembrete.id);
        }
      }
    }
    // Modo intervalo
    else {
      const horaInicio = lembrete.horaInicio;
      const intervaloHoras = lembrete.intervalo;
      
      if (horaInicio && intervaloHoras) {
        const [hInicio, mInicio] = horaInicio.split(':').map(Number);
        const [hAtual, mAtual] = horaAtual.split(':').map(Number);
        
        const minutosInicio = hInicio * 60 + mInicio;
        const minutosAtual = hAtual * 60 + mAtual;
        
        let diferencaMinutos = minutosAtual - minutosInicio;
        if (diferencaMinutos < 0) diferencaMinutos += 24 * 60;
        
        const intervaloMinutos = intervaloHoras * 60;
        
        if (diferencaMinutos % intervaloMinutos === 0) {
          const chave = lembrete.id + '-' + dataAtual + '-' + horaAtual;
          if (!ultimosAlarmesDisparados[chave]) {
            ultimosAlarmesDisparados[chave] = true;
            iniciarAlarme(lembrete.nome, horaAtual, lembrete.id);
          }
        }
      }
    }
  });
  
  // Limpar chaves antigas
  for (let chave in ultimosAlarmesDisparados) {
    const partes = chave.split('-');
    const dataChave = partes[1] + '-' + partes[2] + '-' + partes[3];
    if (dataChave !== dataAtual) delete ultimosAlarmesDisparados[chave];
  }
}

// ============ RESUMO ============
function mostrarResumoAlarmeAtivo() {
  if (!alarmeAtual) return;
  mostrarResumo(alarmeAtual);
}

function mostrarResumoLembrete(id) {
  const lembrete = lembretes.find(l => l.id === id);
  if (!lembrete) return;
  mostrarResumo(lembrete);
}

function mostrarResumo(dados) {
  const modal = document.getElementById('modalResumo');
  const conteudo = document.getElementById('conteudoResumo');
  const titulo = document.getElementById('modalTitulo');
  
  const historicoRemedio = historicoAlarmes.filter(h => h.nome === dados.nome).slice(-10).reverse();
  const hoje = new Date().toLocaleDateString('pt-BR');
  const tomadosHoje = historicoAlarmes.filter(h => h.nome === dados.nome && h.data === hoje).length;
  
  let proximosHorarios = [];
  if (dados.intervalo && dados.horaInicio) {
    const [h, m] = dados.horaInicio.split(':').map(Number);
    const inicio = new Date();
    inicio.setHours(h, m, 0, 0);
    for (let i = 0; i < 5; i++) {
      const prox = new Date(inicio.getTime() + i * dados.intervalo * 3600000);
      proximosHorarios.push(
        String(prox.getHours()).padStart(2, '0') + ':' + 
        String(prox.getMinutes()).padStart(2, '0')
      );
    }
  }
  
  titulo.textContent = alarmeAtivo ? '🚨 ALARME ATIVO!' : '📋 Detalhes do Lembrete';
  
  conteudo.innerHTML = `
    ${alarmeAtivo ? '<div class="resumo-destaque">🚨 TOME AGORA! 🚨</div>' : ''}
    
    <div class="resumo-item">
      <span class="resumo-label">💊 Remédio:</span>
      <span class="resumo-valor">${dados.nome}</span>
    </div>
    
    <div class="resumo-item">
      <span class="resumo-label">🕐 Horário:</span>
      <span class="resumo-valor">${dados.hora || 'N/A'}</span>
    </div>
    
    <div class="resumo-item">
      <span class="resumo-label">🔊 Som:</span>
      <span class="resumo-valor">${dados.som || 'beep'}</span>
    </div>
    
    ${dados.intervalo ? `
      <div class="resumo-item">
        <span class="resumo-label">🕐 Início:</span>
        <span class="resumo-valor">${dados.horaInicio}</span>
      </div>
      <div class="resumo-item">
        <span class="resumo-label">⏱️ Intervalo:</span>
        <span class="resumo-valor">A cada ${dados.intervalo}h</span>
      </div>
      <div style="margin-top:10px; background:#f3e5f5; padding:10px; border-radius:10px;">
        <strong>📅 Próximos horários:</strong><br>
        ${proximosHorarios.map(h => `<span style="background:#9c27b0; color:white; padding:3px 8px; border-radius:10px; margin:2px; display:inline-block; font-size:12px;">${h}</span>`).join(' ')}
      </div>
    ` : ''}
    
    <div class="resumo-item" style="margin-top:10px;">
      <span class="resumo-label">📊 Tomados hoje:</span>
      <span class="resumo-valor">${tomadosHoje}x</span>
    </div>
    
    <div class="resumo-item">
      <span class="resumo-label">📅 Criado em:</span>
      <span class="resumo-valor">${new Date(dados.id).toLocaleDateString('pt-BR')}</span>
    </div>
    
    ${historicoRemedio.length > 0 ? `
      <div style="margin-top:15px;">
        <strong>📜 Últimos registros:</strong>
        <div class="historico-container">
          ${historicoRemedio.map(h => `
            <div class="historico-item">
              <span>📅 ${h.data}</span>
              <span>🕐 ${h.hora}</span>
              <span>✅</span>
            </div>
          `).join('')}
        </div>
      </div>
    ` : '<p style="text-align:center; color:#999; margin-top:10px;">Nenhum registro ainda</p>'}
  `;
  
  modal.classList.add('visivel');
}

function fecharResumo() {
  document.getElementById('modalResumo').classList.remove('visivel');
}

// ============ ADICIONAR LEMBRETE ============
function adicionarLembrete() {
  const nome = document.getElementById('nomeRemedio').value.trim();
  if (!nome) return alert('⚠️ Digite o nome do remédio!');
  
  let hora, horaInicio = null, intervalo = null;
  
  if (modoAtual === 'fixo') {
    hora = document.getElementById('horaFixa').value;
    if (!hora) return alert('⚠️ Selecione o horário!');
  } else {
    horaInicio = document.getElementById('horaInicioIntervalo').value;
    if (!horaInicio) return alert('⚠️ Selecione o horário de início!');
    hora = horaInicio;
    intervalo = intervaloSelecionado;
  }
  
  const duplicata = lembretes.find(l => l.nome === nome && l.hora === hora && l.intervalo === intervalo);
  if (duplicata) return alert('⚠️ Este lembrete já existe!');
  
  lembretes.push({
    id: Date.now(),
    nome,
    hora,
    horaInicio,
    intervalo,
    som: somSelecionado
  });
  
  salvarDados();
  atualizarLista();
  document.getElementById('nomeRemedio').value = '';
  
  if (modoAtual === 'intervalo') {
    atualizarStatus('✅ Lembrete adicionado! Início: ' + horaInicio + ' a cada ' + intervalo + 'h', 'status-ok');
  } else {
    atualizarStatus('✅ Lembrete adicionado! Alarme: ' + hora, 'status-ok');
  }
}

// ============ LISTA ============
function atualizarLista() {
  const div = document.getElementById('listaLembretes');
  document.getElementById('contador').textContent = '(' + lembretes.length + ')';
  
  if (!lembretes.length) {
    div.innerHTML = '<p style="color:#999; text-align:center;">Nenhum lembrete adicionado</p>';
    return;
  }
  
  lembretes.sort((a, b) => a.hora.localeCompare(b.hora));
  
  div.innerHTML = lembretes.map(l => `
    <div class="lembrete-card" onclick="mostrarResumoLembrete(${l.id})">
      <div class="lembrete-info">
        <h4>💊 ${l.nome} ${l.intervalo ? '🔁' : ''}</h4>
        ${l.intervalo ? 
          `<span class="lembrete-hora">🕐 Início: ${l.horaInicio}</span>
           <span class="lembrete-hora">🔁 A cada ${l.intervalo}h</span>` :
          `<span class="lembrete-hora">🕒 ${l.hora}</span>`
        }
        <span class="lembrete-hora">🔊 ${l.som}</span>
      </div>
      <div class="lembrete-acoes">
        <button class="btn-pequeno btn-editar" onclick="event.stopPropagation(); editarLembrete(${l.id})">✏️</button>
        <button class="btn-pequeno btn-desligar" onclick="event.stopPropagation(); desligarAlarmeIndividual(${l.id})">🔕</button>
        <button class="btn-pequeno btn-excluir" onclick="event.stopPropagation(); removerLembrete(${l.id})">🗑️</button>
      </div>
    </div>
  `).join('');
}

function editarLembrete(id) {
  const l = lembretes.find(x => x.id === id);
  if (!l) return;
  const nh = prompt('Novo horário (HH:MM):', l.horaInicio || l.hora);
  if (nh && /^\d{2}:\d{2}$/.test(nh)) {
    if (l.intervalo) { l.horaInicio = nh; l.hora = nh; }
    else l.hora = nh;
    salvarDados();
    atualizarLista();
  }
}

function desligarAlarmeIndividual(id) {
  if (alarmeAtivo) pararAlarme();
}

function removerLembrete(id) {
  if (confirm('Remover?')) {
    lembretes = lembretes.filter(l => l.id !== id);
    salvarDados();
    atualizarLista();
  }
}

function limparTodos() {
  if (confirm('Remover TODOS?')) {
    lembretes = [];
    salvarDados();
    atualizarLista();
    pararAlarme();
  }
}

// ============ INTERFACE ============
function mudarModo(m) {
  modoAtual = m;
  document.getElementById('modoFixo').classList.toggle('ativo', m==='fixo');
  document.getElementById('modoIntervalo').classList.toggle('ativo', m==='intervalo');
  document.getElementById('painelFixo').classList.toggle('visivel', m==='fixo');
  document.getElementById('painelIntervalo').classList.toggle('visivel', m==='intervalo');
}

function selecionarIntervalo(h, btn) {
  intervaloSelecionado = h;
  document.querySelectorAll('.intervalo-btn').forEach(b => b.classList.remove('ativo'));
  btn.classList.add('ativo');
  atualizarPreviewIntervalo();
}

function atualizarPreviewIntervalo() {
  const horaInicio = document.getElementById('horaInicioIntervalo').value;
  if (horaInicio) {
    const [h, m] = horaInicio.split(':').map(Number);
    const inicio = new Date();
    inicio.setHours(h, m, 0);
    const proximos = [];
    for (let i = 0; i < 4; i++) {
      const p = new Date(inicio.getTime() + i * intervaloSelecionado * 3600000);
      proximos.push(String(p.getHours()).padStart(2,'0')+':'+String(p.getMinutes()).padStart(2,'0'));
    }
    document.getElementById('infoProximoAlarme').style.display = 'block';
    document.getElementById('infoProximoAlarme').innerHTML = '📅 Próximos: <strong>' + proximos.join(' → ') + ' → ...</strong>';
  }
}

function selecionarSom(s, btn) {
  somSelecionado = s;
  document.querySelectorAll('.som-btn').forEach(b => b.classList.remove('ativo'));
  btn.classList.add('ativo');
}

function testarSom() { tocarSom(somSelecionado); }

function testarAlarmeAgora() {
  if (Notification.permission !== 'granted') {
    Notification.requestPermission();
    return;
  }
  iniciarAlarme('🧪 TESTE', new Date().toLocaleTimeString(), 'teste');
}

function atualizarStatus(msg, cls) {
  const s = document.getElementById('statusSistema');
  s.textContent = msg;
  s.className = 'status-badge ' + cls;
}

function salvarDados() {
  localStorage.setItem('app_remedios_completo_v5', JSON.stringify(lembretes));
}

// ============ INICIAR ============
function iniciar() {
  const agora = new Date();
  const h = String(agora.getHours()).padStart(2,'0')+':'+String(agora.getMinutes()).padStart(2,'0');
  document.getElementById('horaFixa').value = h;
  document.getElementById('horaInicioIntervalo').value = h;
  
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
  }
  
  atualizarLista();
  setInterval(verificarAlarmes, 10000);
  verificarAlarmes();
  
  document.getElementById('modalResumo').addEventListener('click', function(e) {
    if (e.target === this) fecharResumo();
  });
  
  atualizarStatus('✅ Sistema funcionando!', 'status-ok');
}

iniciar();
</script>
