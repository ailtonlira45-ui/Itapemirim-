<script>
// ============ RELÓGIO DIGITAL ============
function atualizarRelogio() {
  const agora = new Date();
  
  // Data formatada
  const diasSemana = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
  const meses = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
  
  const diaSemana = diasSemana[agora.getDay()];
  const dia = String(agora.getDate()).padStart(2, '0');
  const mes = meses[agora.getMonth()];
  const ano = agora.getFullYear();
  
  document.getElementById('relogioData').textContent = `${diaSemana}, ${dia} de ${mes} de ${ano}`;
  
  // Hora formatada
  const horas = String(agora.getHours()).padStart(2, '0');
  const minutos = String(agora.getMinutes()).padStart(2, '0');
  const segundos = String(agora.getSeconds()).padStart(2, '0');
  
  document.getElementById('relogioHora').textContent = `${horas}:${minutos}`;
  document.getElementById('relogioSegundos').textContent = segundos;
  
  // Atualizar informação do próximo alarme
  atualizarProximoAlarme();
}

// Atualizar relógio a cada segundo
setInterval(atualizarRelogio, 1000);
atualizarRelogio();

// ============ MOSTRAR PRÓXIMO ALARME ============
function atualizarProximoAlarme() {
  if (lembretes.length === 0) {
    document.getElementById('proximoAlarmeInfo').style.display = 'none';
    return;
  }
  
  const agora = new Date();
  const horaAtual = String(agora.getHours()).padStart(2, '0') + ':' + 
                    String(agora.getMinutes()).padStart(2, '0');
  
  // Encontrar o próximo alarme
  let proximo = null;
  let menorDiferenca = Infinity;
  
  lembretes.forEach(l => {
    let horaAlarme = l.hora;
    
    // Se for intervalo, calcular próximo horário
    if (l.intervalo && l.horaInicio) {
      const [hIni, mIni] = l.horaInicio.split(':').map(Number);
      const inicioMinutos = hIni * 60 + mIni;
      const atualMinutos = new Date().getHours() * 60 + new Date().getMinutes();
      
      let diff = atualMinutos - inicioMinutos;
      if (diff < 0) diff += 24 * 60;
      
      const intervaloMinutos = l.intervalo * 60;
      const proximoMinutos = inicioMinutos + (Math.floor(diff / intervaloMinutos) + 1) * intervaloMinutos;
      
      const h = Math.floor((proximoMinutos % (24 * 60)) / 60);
      const m = proximoMinutos % 60;
      horaAlarme = String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
    }
    
    // Calcular diferença
    const [hAlarme, mAlarme] = horaAlarme.split(':').map(Number);
    let diferencaMinutos = (hAlarme * 60 + mAlarme) - (new Date().getHours() * 60 + new Date().getMinutes());
    if (diferencaMinutos < 0) diferencaMinutos += 24 * 60;
    
    if (diferencaMinutos < menorDiferenca) {
      menorDiferenca = diferencaMinutos;
      proximo = { ...l, horaProxima: horaAlarme, diferenca: diferencaMinutos };
    }
  });
  
  if (proximo) {
    const div = document.getElementById('proximoAlarmeInfo');
    div.style.display = 'block';
    
    if (proximo.diferenca === 0) {
      div.innerHTML = `🔔 <strong>AGORA!</strong> - ${proximo.nome}`;
      div.style.background = '#ffebee';
      div.style.borderLeftColor = '#f44336';
    } else if (proximo.diferenca < 60) {
      div.innerHTML = `⏰ Próximo: <strong>${proximo.nome}</strong> em ${proximo.diferenca} minutos (${proximo.horaProxima})`;
      div.style.background = '#fff3e0';
      div.style.borderLeftColor = '#ff9800';
    } else {
      const horas = Math.floor(proximo.diferenca / 60);
      const mins = proximo.diferenca % 60;
      div.innerHTML = `📅 Próximo: <strong>${proximo.nome}</strong> às ${proximo.horaProxima} (${horas}h${mins}min)`;
      div.style.background = '#e8f5e9';
      div.style.borderLeftColor = '#4caf50';
    }
  }
}

// ============ BANCO DE DADOS LOCAL ============
const DB_NAME = 'AlarmeRemedioDB';
let db = null;

function abrirBanco() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, 1);
    
    request.onupgradeneeded = (event) => {
      const db = event.target.result;
      if (!db.objectStoreNames.contains('lembretes')) {
        db.createObjectStore('lembretes', { keyPath: 'id' });
      }
      if (!db.objectStoreNames.contains('historico')) {
        db.createObjectStore('historico', { keyPath: 'id', autoIncrement: true });
      }
    };
    
    request.onsuccess = (event) => {
      db = event.target.result;
      resolve(db);
    };
    
    request.onerror = (event) => reject(event.target.error);
  });
}

function salvarLembrete(lembrete) {
  return new Promise((resolve, reject) => {
    const transaction = db.transaction(['lembretes'], 'readwrite');
    const store = transaction.objectStore('lembretes');
    store.put(lembrete);
    transaction.oncomplete = () => resolve();
    transaction.onerror = () => reject();
  });
}

function buscarLembretes() {
  return new Promise((resolve, reject) => {
    const transaction = db.transaction(['lembretes'], 'readonly');
    const store = transaction.objectStore('lembretes');
    const request = store.getAll();
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject();
  });
}

function deletarLembrete(id) {
  return new Promise((resolve, reject) => {
    const transaction = db.transaction(['lembretes'], 'readwrite');
    const store = transaction.objectStore('lembretes');
    store.delete(id);
    transaction.oncomplete = () => resolve();
    transaction.onerror = () => reject();
  });
}

function salvarHistorico(registro) {
  return new Promise((resolve, reject) => {
    const transaction = db.transaction(['historico'], 'readwrite');
    const store = transaction.objectStore('historico');
    store.add(registro);
    transaction.oncomplete = () => resolve();
    transaction.onerror = () => reject();
  });
}

function buscarHistorico() {
  return new Promise((resolve, reject) => {
    const transaction = db.transaction(['historico'], 'readonly');
    const store = transaction.objectStore('historico');
    const request = store.getAll();
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject();
  });
}

let lembretes = [];

if ('Notification' in window && Notification.permission === 'granted') {

// ============ SOM ============
function tocarSom(tipo) {
  try {
    if (!audioCtx || audioCtx.state === 'closed') {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    
    const ctx = audioCtx;
    const now = ctx.currentTime;
    
    function beep(freq, inicio, dur, onda='square', vol=0.3) {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type = onda; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, inicio);
      g.gain.exponentialRampToValueAtTime(0.001, inicio+dur);
      o.start(inicio); o.stop(inicio+dur);
    }
    
    if (tipo === 'beep') {
      beep(880, now, 0.3); beep(880, now+0.4, 0.3); beep(880, now+0.8, 0.3);
    } else if (tipo === 'melodia') {
      beep(523, now, 0.2, 'sine'); beep(659, now+0.2, 0.2, 'sine');
      beep(784, now+0.4, 0.3, 'sine');
    } else if (tipo === 'sirene') {
      for(let i=0; i<8; i++) beep(400+i*100, now+i*0.15, 0.15, 'sawtooth');
    } else if (tipo === 'sino') {
      beep(1200, now, 0.15, 'triangle'); beep(1000, now+0.15, 0.2, 'triangle');
    } else if (tipo === 'vibracao') {
      beep(100, now, 0.5, 'square', 0.8);
      if (navigator.vibrate) navigator.vibrate([300,100,300]);
    } else if (tipo === 'eletronico') {
      beep(440, now, 0.1); beep(660, now+0.1, 0.1); beep(880, now+0.2, 0.2);
    }
  } catch(e) {}
}

// ============ ALARME ============
async function iniciarAlarme(lembrete) {
  if (alarmeAtivo) return;
  alarmeAtivo = true;
  
  document.getElementById('alarmeAtivo').style.display = 'block';
  document.getElementById('alarmeAtivo').innerHTML = 
    `🚨 ${lembrete.nome} 🚨<br><small>👆 Toque para detalhes</small>`;
  
  function disparar() {
    tocarSom(lembrete.som || 'beep');
    if (navigator.vibrate) navigator.vibrate([500,200,500]);
    
    if (Notification.permission === 'granted') {
      new Notification('💊 HORA DO REMÉDIO!', {
        body: lembrete.nome + ' - ' + (lembrete.hora || ''),
        icon: '💊',
        vibrate: [500,200,500],
        requireInteraction: true,
        tag: 'alarme'
      });
    }
  }
  
  disparar();
  intervaloAlarme = setInterval(disparar, 5000);
  
  const agora = new Date();
  await salvarHistorico({
    nome: lembrete.nome,
    data: agora.toLocaleDateString('pt-BR'),
    hora: agora.toLocaleTimeString('pt-BR'),
    timestamp: Date.now()
  });
  
  historico = await buscarHistorico();
  
  setTimeout(() => pararAlarme(), 120000);
  
  document.getElementById('statusSistema').textContent = '🚨 ALARME: ' + lembrete.nome;
  document.getElementById('statusSistema').className = 'status status-erro';
}

function pararAlarme() {
  alarmeAtivo = false;
  if (intervaloAlarme) { clearInterval(intervaloAlarme); intervaloAlarme = null; }
  document.getElementById('alarmeAtivo').style.display = 'none';
  document.getElementById('statusSistema').textContent = '✅ Alarme parado';
  document.getElementById('statusSistema').className = 'status status-ok';
}

// ============ VERIFICAÇÃO DE HORÁRIOS ============
function verificarAlarmes() {
  if (alarmeAtivo) return;
  
  const agora = new Date();
  const horaAtual = String(agora.getHours()).padStart(2, '0') + ':' + 
                    String(agora.getMinutes()).padStart(2, '0');
  
  lembretes.forEach(lembrete => {
    let deveAlarmar = false;
    
    if (!lembrete.intervalo && lembrete.hora === horaAtual) {
      deveAlarmar = true;
    }
    
    if (lembrete.intervalo && lembrete.horaInicio) {
      const [hIni, mIni] = lembrete.horaInicio.split(':').map(Number);
      const [hAtu, mAtu] = horaAtual.split(':').map(Number);
      
      let diff = (hAtu * 60 + mAtu) - (hIni * 60 + mIni);
      if (diff < 0) diff += 24 * 60;
      
      if (diff % (lembrete.intervalo * 60) === 0) {
        deveAlarmar = true;
      }
    }
    
    if (deveAlarmar) {
      iniciarAlarme(lembrete);
    }
  });
}

// ============ MOSTRAR DETALHES ============

      <strong>🚨 ALARME ATIVO! 🚨</strong>
    </div>
    <div class="info-linha">
      <span class="info-label">📅 Data:</span>
      <span class="info-valor">${hoje}</span>
    </div>
    <div class="info-linha">
      <span class="info-label">🕐 Hora:</span>
      <span class="info-valor">${agora.toLocaleTimeString('pt-BR')}</span>
    </div>
    <div class="info-linha">
      <span class="info-label">📊 Alarmes hoje:</span>
      <span class="info-valor">${histHoje.length}</span>
    </div>
    ${histRecente.length > 0 ? `
      <div style="margin-top:15px;">

            <div class="historico-item">

  document.getElementById('modalTitulo').textContent = '🚨 Alarme Ativo!';

async function verDetalhesLembrete(id) {
  const l = lembretes.find(x => x.id === id);
  if (!l) return;
  
  const modal = document.getElementById('modalDetalhes');
  const conteudo = document.getElementById('modalConteudo');
  const hoje = new Date().toLocaleDateString('pt-BR');
  
  const histLembrete = historico.filter(h => h.nome === l.nome).slice(-10).reverse();
  const tomadosHoje = historico.filter(h => h.nome === l.nome && h.data === hoje).length;
  
  let proximos = [];
  if (l.intervalo && l.horaInicio) {
    const [h, m] = l.horaInicio.split(':').map(Number);
    const ini = new Date(); ini.setHours(h, m, 0);
    for (let i=0; i<4; i++) {
      const p = new Date(ini.getTime() + i*l.intervalo*3600000);
      proximos.push(String(p.getHours()).padStart(2,'0')+':'+String(p.getMinutes()).padStart(2,'0'));
    }
  }
  
  conteudo.innerHTML = `
    <div class="info-linha">
      <span class="info-label">💊 Nome:</span>
      <span class="info-valor">${l.nome}</span>
    </div>
    <div class="info-linha">
      <span class="info-label">🕐 Horário:</span>
      <span class="info-valor">${l.intervalo ? l.horaInicio + ' (início)' : l.hora}</span>
    </div>
    ${l.intervalo ? `
      <div class="info-linha">
        <span class="info-label">⏱️ Intervalo:</span>
        <span class="info-valor">A cada ${l.intervalo}h</span>
      </div>
      <div style="background:#f3e5f5; padding:10px; border-radius:10px; margin:10px 0;">
        <strong>📅 Próximos:</strong><br>
        ${proximos.map(h => `<span style="background:#9c27b0; color:white; padding:3px 8px; border-radius:10px; margin:2px; display:inline-block; font-size:12px;">${h}</span>`).join(' ')}
      </div>
    ` : ''}
    <div class="info-linha">
      <span class="info-label">🔊 Som:</span>
      <span class="info-valor">${l.som}</span>
    </div>
    <div class="info-linha">
      <span class="info-label">📊 Tomados hoje:</span>
      <span class="info-valor">${tomadosHoje}x</span>
    </div>
    ${histLembrete.length > 0 ? `
      <div style="margin-top:15px;">
        <strong>📜 Histórico:</strong>
        <div class="historico-lista">
          ${histLembrete.map(h => `
            <div class="historico-item">
              <span>${h.data}</span>
              <span>${h.hora}</span>
            </div>
          `).join('')}
        </div>
      </div>
    ` : '<p style="color:#999;">Nenhum registro</p>'}
  `;
  
  document.getElementById('modalTitulo').textContent = '📋 ' + l.nome;
  modal.classList.add('visivel');
}

function fecharModal() {
  document.getElementById('modalDetalhes').classList.remove('visivel');
}

// ============ CRUD ============
async function adicionarLembrete() {
  const nome = document.getElementById('nomeRemedio').value.trim();
  if (!nome) return alert('Digite o nome!');
  
  let hora, horaInicio = null, intervalo = null;
  
  if (modoAtual === 'fixo') {
    hora = document.getElementById('horaFixa').value;
    if (!hora) return alert('Selecione o horário!');
  } else {
    horaInicio = document.getElementById('horaInicioIntervalo').value;
    if (!horaInicio) return alert('Selecione o horário de início!');
    hora = horaInicio;
    intervalo = intervaloSelecionado;
  }
  
  const lembrete = {
    id: Date.now(),
    nome,
    hora,
    horaInicio,
    intervalo,
    som: somSelecionado
  };
  
  await salvarLembrete(lembrete);
  lembretes = await buscarLembretes();
  atualizarLista();
  atualizarProximoAlarme();
  document.getElementById('nomeRemedio').value = '';
  document.getElementById('statusSistema').textContent = '✅ Lembrete salvo!';
  document.getElementById('statusSistema').className = 'status status-ok';
}

async function editarLembrete(id) {
  const l = lembretes.find(x => x.id === id);
  if (!l) return;
  const h = prompt('Novo horário (HH:MM):', l.horaInicio || l.hora);
  if (h && /^\d{2}:\d{2}$/.test(h)) {
    if (l.intervalo) { l.horaInicio = h; l.hora = h; }
    else l.hora = h;
    await salvarLembrete(l);
    lembretes = await buscarLembretes();
    atualizarLista();
    atualizarProximoAlarme();
  }
}

async function removerLembrete(id) {
  if (confirm('Remover este lembrete?')) {
    await deletarLembrete(id);
    lembretes = await buscarLembretes();
    atualizarLista();
    atualizarProximoAlarme();
  }
}

async function limparTudo() {
  if (confirm('Remover TODOS os lembretes?')) {
    for (let l of lembretes) {
      await deletarLembrete(l.id);
    }
    lembretes = [];
    atualizarLista();
    atualizarProximoAlarme();
  }
}

// ============ INTERFACE ============
function atualizarLista() {
  const div = document.getElementById('listaLembretes');
  document.getElementById('contador').textContent = '(' + lembretes.length + ')';
  
  if (!lembretes.length) {
    div.innerHTML = '<p style="color:#999; text-align:center;">Nenhum lembrete</p>';
    return;
  }
  
  lembretes.sort((a, b) => a.hora.localeCompare(b.hora));
  
  div.innerHTML = lembretes.map(l => `
    <div class="lembrete-item" onclick="verDetalhesLembrete(${l.id})">
      <div class="lembrete-info">
        <h4>💊 ${l.nome} ${l.intervalo ? '🔁' : ''}</h4>
        ${l.intervalo ? 
          `<span class="tag">🕐 ${l.horaInicio}</span><span class="tag">⏱️ ${l.intervalo}h</span>` :
          `<span class="tag">🕒 ${l.hora}</span>`
        }
        <span class="tag">🔊 ${l.som}</span>
      </div>
      <div class="botoes-acao">
        <button class="btn-mini btn-editar" onclick="event.stopPropagation(); editarLembrete(${l.id})">✏️</button>
        <button class="btn-mini btn-excluir" onclick="event.stopPropagation(); removerLembrete(${l.id})">🗑️</button>
      </div>
    </div>
  `).join('');
}

function mudarModo(m) {
  modoAtual = m;
  document.getElementById('modoFixo').classList.toggle('ativo', m==='fixo');
  document.getElementById('modoIntervalo').classList.toggle('ativo', m==='intervalo');
  document.getElementById('painelFixo').classList.toggle('visivel', m==='fixo');
  document.getElementById('painelIntervalo').classList.toggle('visivel', m==='intervalo');
}

function selecionarIntervalo(h, btn) {
  intervaloSelecionado = h;
  document.querySelectorAll('.intervalo-btn').forEach(b => b.classList.remove('ativo'));
  btn.classList.add('ativo');
  atualizarPreview();
}

function atualizarPreview() {
  const hIni = document.getElementById('horaInicioIntervalo').value;
  if (hIni) {
    const [h, m] = hIni.split(':').map(Number);
    const ini = new Date(); ini.setHours(h, m, 0);
    const p = [];
    for (let i=0; i<4; i++) {
      const x = new Date(ini.getTime() + i*intervaloSelecionado*3600000);
      p.push(String(x.getHours()).padStart(2,'0')+':'+String(x.getMinutes()).padStart(2,'0'));
    }
    document.getElementById('previewIntervalo').style.display = 'block';
    document.getElementById('previewIntervalo').innerHTML = '📅 Próximos: <strong>' + p.join(' → ') + ' → ...</strong>';
  }
}

function selecionarSom(s, btn) {
  somSelecionado = s;
  document.querySelectorAll('.som-btn').forEach(b => b.classList.remove('ativo'));
  btn.classList.add('ativo');
}

function testarSom() { tocarSom(somSelecionado); }

function testarAlarmeAgora() {
  if (Notification.permission !== 'granted') {
    ativarNotificacoes();
  }
  iniciarAlarme({nome:'🧪 TESTE', som:somSelecionado, hora: new Date().toLocaleTimeString()});
}

// ============ INICIAR ============
async function iniciar() {
  await inicializarBanco();
  
  const agora = new Date();
  const h = String(agora.getHours()).padStart(2,'0')+':'+String(agora.getMinutes()).padStart(2,'0');
  document.getElementById('horaFixa').value = h;
  document.getElementById('horaInicioIntervalo').value = h;
  
  setInterval(verificarAlarmes, 15000);
  verificarAlarmes();
  
  document.getElementById('modalDetalhes').addEventListener('click', function(e) {
    if (e.target === this) fecharModal();
  });
  
  if ('wakeLock' in navigator) {
    setInterval(() => {
      navigator.wakeLock.request('screen').catch(() => {});
    }, 60000);
  }
  
  document.getElementById('statusSistema').textContent = '✅ Sistema pronto!';
  document.getElementById('statusSistema').className = 'status status-ok';
}

iniciar();
</script>
