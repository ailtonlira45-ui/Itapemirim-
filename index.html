<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>💊 Alarme Remédio</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 15px;
    }
    
    .container {
      max-width: 550px;
      margin: 0 auto;
      background: white;
      border-radius: 25px;
      padding: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }
    
    h1 { text-align: center; color: #333; font-size: 28px; margin-bottom: 5px; }
    .subtitulo { text-align: center; color: #666; font-size: 14px; margin-bottom: 20px; }
    
    .relogio-container {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 15px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    
    .relogio-data { color: #8888ff; font-size: 16px; font-weight: bold; margin-bottom: 5px; }
    .relogio-hora { color: #00ff88; font-size: 60px; font-weight: bold; font-family: 'Courier New', monospace; text-shadow: 0 0 20px rgba(0, 255, 136, 0.5); letter-spacing: 3px; margin: 10px 0; }
    .relogio-segundos { color: #ff6b6b; font-size: 18px; font-weight: bold; }
    
    .alarme-tela-cheia {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(255, 0, 0, 0.9);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      animation: piscarFundo 0.5s infinite;
      cursor: pointer;
    }
    
    .alarme-tela-cheia.ativo { display: flex; }
    
    @keyframes piscarFundo {
      0%, 100% { background: rgba(255, 0, 0, 0.9); }
      50% { background: rgba(255, 255, 0, 0.9); }
    }
    
    .alarme-tela-cheia h2 { color: white; font-size: 40px; text-align: center; margin-bottom: 20px; }
    .alarme-tela-cheia p { color: white; font-size: 24px; margin-bottom: 30px; }
    .alarme-tela-cheia button { background: white; color: #ff0000; border: none; padding: 20px 40px; border-radius: 50px; font-size: 24px; font-weight: bold; cursor: pointer; }
    
    .alerta-alarme {
      background: #ff0000; color: white; padding: 20px; border-radius: 15px;
      text-align: center; margin: 15px 0; font-size: 22px; font-weight: bold;
      display: none; animation: piscar 0.5s infinite; cursor: pointer;
    }
    
    @keyframes piscar {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    .status-badge { padding: 10px; border-radius: 10px; text-align: center; margin: 10px 0; font-weight: bold; font-size: 14px; }
    .status-ok { background: #d4edda; color: #155724; }
    .status-erro { background: #f8d7da; color: #721c24; }
    .status-aviso { background: #fff3cd; color: #856404; }
    
    .secao { background: #f8f9fa; border-radius: 15px; padding: 15px; margin: 15px 0; border: 1px solid #dee2e6; }
    .secao h3 { color: #495057; margin-bottom: 12px; font-size: 16px; }
    
    label { display: block; color: #495057; font-weight: bold; margin: 8px 0 4px; font-size: 14px; }
    
    input { width: 100%; padding: 12px; border: 2px solid #dee2e6; border-radius: 10px; font-size: 16px; margin-bottom: 10px; outline: none; }
    input:focus { border-color: #667eea; }
    
    .modo-botoes { display: flex; gap: 8px; margin: 10px 0; }
    
    .modo-btn { flex: 1; padding: 10px; border: 2px solid #667eea; background: white; color: #667eea; border-radius: 25px; font-weight: bold; cursor: pointer; font-size: 14px; }
    .modo-btn.ativo { background: #667eea; color: white; }
    
    .intervalos { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin: 10px 0; }
    
    .intervalo-btn { padding: 10px 5px; border: 2px solid #dee2e6; background: white; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 12px; }
    .intervalo-btn.ativo { background: #28a745; color: white; border-color: #28a745; }
    
    .sons-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
    
    .som-btn { padding: 12px 8px; border: 2px solid #dee2e6; background: white; border-radius: 15px; font-weight: bold; cursor: pointer; font-size: 14px; }
    .som-btn.ativo { background: #ffc107; border-color: #ff9800; color: #333; }
    
    .btn { width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; margin: 6px 0; }
    .btn:active { transform: scale(0.98); }
    .btn-primario { background: #667eea; color: white; }
    .btn-sucesso { background: #28a745; color: white; }
    .btn-perigo { background: #dc3545; color: white; }
    .btn-alerta { background: #ffc107; color: #333; }
    .btn-info { background: #17a2b8; color: white; }
    
    .lembrete-card { background: white; border: 2px solid #dee2e6; border-radius: 15px; padding: 15px; margin: 10px 0; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
    .lembrete-card:hover { border-color: #667eea; }
    .lembrete-info h4 { color: #333; margin-bottom: 5px; }
    
    .lembrete-hora { background: #e9ecef; padding: 4px 12px; border-radius: 15px; font-size: 14px; color: #495057; display: inline-block; margin-right: 5px; margin-top: 3px; }
    .lembrete-acoes { display: flex; gap: 5px; }
    
    .btn-pequeno { padding: 8px 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; }
    .btn-editar { background: #ffc107; color: #333; }
    .btn-excluir { background: #dc3545; color: white; }
    
    .painel { display: none; }
    .painel.visivel { display: block; }
    
    .proximo-alarme {
      background: #f3e5f5;
      border-left: 4px solid #9c27b0;
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
      font-size: 13px;
      color: #4a148c;
      font-weight: bold;
    }

    .aviso-intervalo {
      background: #e3f2fd;
      border-left: 4px solid #2196F3;
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
      font-size: 13px;
      color: #0d47a1;
    }
    
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); z-index: 10000; justify-content: center; align-items: center; }
    .modal-overlay.visivel { display: flex; }
    
    .modal-resumo { background: white; border-radius: 20px; padding: 25px; max-width: 400px; width: 90%; max-height: 80vh; overflow-y: auto; }
    .modal-resumo h2 { color: #dc3545; text-align: center; margin-bottom: 20px; }
    
    .resumo-item { background: #f8f9fa; padding: 12px; border-radius: 10px; margin: 8px 0; display: flex; justify-content: space-between; }
    .resumo-label { font-weight: bold; color: #495057; }
    .resumo-valor { color: #667eea; font-weight: bold; }
    
    .destaque { background: #ffe6e6; border: 2px solid #dc3545; padding: 15px; border-radius: 10px; text-align: center; margin: 15px 0; font-weight: bold; color: #dc3545; }
    
    .btn-fechar-modal { background: #667eea; color: white; border: none; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 15px; }
    .historico-container { max-height: 200px; overflow-y: auto; margin: 10px 0; }
    .historico-item { background: #f0f0f0; padding: 8px; border-radius: 8px; margin: 5px 0; font-size: 12px; display: flex; justify-content: space-between; }
    
    .horarios-intervalo {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin: 10px 0;
    }
    
    .horario-chip {
      background: #9c27b0;
      color: white;
      padding: 5px 10px;
      border-radius: 15px;
      font-size: 12px;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>💊 Alarme Remédio</h1>
  <p class="subtitulo">⏰ Intervalo funcionando corretamente!</p>
  
  <div class="relogio-container">
    <div class="relogio-data" id="relogioData"></div>
    <div class="relogio-hora" id="relogioHora"></div>
    <div class="relogio-segundos" id="relogioSegundos"></div>
  </div>
  
  <div id="alarmeTelaCheia" class="alarme-tela-cheia" onclick="pararAlarme()">
    <h2>🚨 HORA DO REMÉDIO! 🚨</h2>
    <p id="alarmeTelaCheiaNome"></p>
    <button onclick="event.stopPropagation(); pararAlarme();">🔕 DESLIGAR</button>
  </div>
  
  <div id="alertaAlarme" class="alerta-alarme" onclick="mostrarResumoAlarmeAtivo()">
    🚨 HORA DO REMÉDIO! 🚨
  </div>
  
  <div id="statusSistema" class="status-badge status-aviso">⏳ Carregando...</div>

  <div id="modalResumo" class="modal-overlay">
    <div class="modal-resumo">
      <h2 id="modalTitulo">📋 Detalhes</h2>
      <div id="conteudoResumo"></div>
      <button class="btn-fechar-modal" onclick="fecharResumo()">✅ Fechar</button>
    </div>
  </div>

  <div class="secao">
    <h3>📋 Adicionar Remédio</h3>
    <label>💊 Nome:</label>
    <input type="text" id="nomeRemedio" placeholder="Ex: Dipirona 500mg" autocomplete="off">
    
    <div class="modo-botoes">
      <button id="modoFixo" class="modo-btn ativo" onclick="mudarModo('fixo')">🕒 Horário Fixo</button>
      <button id="modoIntervalo" class="modo-btn" onclick="mudarModo('intervalo')">🔁 Intervalo</button>
    </div>
    
    <div id="painelFixo" class="painel visivel">
      <label>🕐 Horário:</label>
      <input type="time" id="horaFixa">
    </div>
    
    <div id="painelIntervalo" class="painel">
      <label>🕐 Horário de início:</label>
      <input type="time" id="horaInicioIntervalo" onchange="atualizarPreviewIntervalo()">
      <label>⏱️ Repetir a cada:</label>
      <div class="intervalos">
        <button class="intervalo-btn" onclick="selecionarIntervalo(1, this)">1h</button>
        <button class="intervalo-btn" onclick="selecionarIntervalo(4, this)">4h</button>
        <button class="intervalo-btn" onclick="selecionarIntervalo(6, this)">6h</button>
        <button class="intervalo-btn ativo" onclick="selecionarIntervalo(8, this)">8h</button>
        <button class="intervalo-btn" onclick="selecionarIntervalo(12, this)">12h</button>
      </div>
      
      <div id="infoProximoAlarme" class="aviso-intervalo" style="display:none;"></div>
      <div id="todosHorarios" class="horarios-intervalo" style="display:none;"></div>
    </div>
    
    <label>🔊 Som:</label>
    <div class="sons-grid">
      <button class="som-btn ativo" onclick="selecionarSom('beep', this)">🔔 Beep</button>
      <button class="som-btn" onclick="selecionarSom('melodia', this)">🎵 Melodia</button>
      <button class="som-btn" onclick="selecionarSom('sirene', this)">🚨 Sirene</button>
      <button class="som-btn" onclick="selecionarSom('sino', this)">🛎️ Sino</button>
      <button class="som-btn" onclick="selecionarSom('vibracao', this)">📳 Vibração</button>
      <button class="som-btn" onclick="selecionarSom('eletronico', this)">🎹 Eletrônico</button>
    </div>
    
    <button class="btn btn-primario" onclick="testarSom()">🔊 Testar Som</button>
    <button class="btn btn-sucesso" onclick="adicionarLembrete()">➕ Adicionar Lembrete</button>
  </div>

  <div class="secao">
    <h3>📌 Seus Lembretes <span id="contador">(0)</span></h3>
    <div id="listaLembretes"><p style="color:#999;">Nenhum lembrete</p></div>
  </div>

  <button class="btn btn-perigo" onclick="pararAlarme()">🔕 Parar Alarme</button>
  <button class="btn btn-info" onclick="testarAlarmeAgora()">🧪 Testar Alarme</button>
  <button class="btn btn-alerta" onclick="limparTodos()">🗑️ Limpar Todos</button>
</div>

<script>
// ============ RELÓGIO ============
function atualizarRelogio() {
  const agora = new Date();
  const dias = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
  const meses = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
  
  document.getElementById('relogioData').textContent = `${dias[agora.getDay()]}, ${String(agora.getDate()).padStart(2,'0')} de ${meses[agora.getMonth()]} de ${agora.getFullYear()}`;
  document.getElementById('relogioHora').textContent = `${String(agora.getHours()).padStart(2,'0')}:${String(agora.getMinutes()).padStart(2,'0')}`;
  document.getElementById('relogioSegundos').textContent = String(agora.getSeconds()).padStart(2,'0');
}
setInterval(atualizarRelogio, 1000);
atualizarRelogio();

// ============ DADOS ============
const CHAVE_LEMBRETES = 'alarme_remedios_final';
const CHAVE_HISTORICO = 'alarme_historico_final';

let lembretes = [];
let historicoAlarmes = [];
let modoAtual = 'fixo';
let intervaloSelecionado = 8;
let somSelecionado = 'beep';
let alarmeAtivo = false;
let intervaloAlarme = null;
let audioContext = null;
let ultimosAlarmesDisparados = {};
let alarmeAtual = null;

function salvarTudo() {
  try {
    localStorage.setItem(CHAVE_LEMBRETES, JSON.stringify(lembretes));
    localStorage.setItem(CHAVE_HISTORICO, JSON.stringify(historicoAlarmes));
    console.log('💾 Salvo! Lembretes:', lembretes.length);
  } catch(e) {
    console.error('❌ Erro ao salvar:', e);
  }
}

function carregarTudo() {
  try {
    const l = localStorage.getItem(CHAVE_LEMBRETES);
    const h = localStorage.getItem(CHAVE_HISTORICO);
    lembretes = l ? JSON.parse(l) : [];
    historicoAlarmes = h ? JSON.parse(h) : [];
    console.log('📂 Carregado! Lembretes:', lembretes.length);
  } catch(e) {
    lembretes = [];
    historicoAlarmes = [];
  }
}

// ============ SOM ============
function tocarSom(tipo) {
  try {
    if (!audioContext || audioContext.state === 'closed') {
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioContext.state === 'suspended') audioContext.resume();
    
    const ctx = audioContext;
    const now = ctx.currentTime;
    
    function beep(freq, inicio, dur, onda='square', vol=0.4) {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type = onda; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, inicio);
      g.gain.exponentialRampToValueAtTime(0.001, inicio+dur);
      o.start(inicio); o.stop(inicio+dur);
    }
    
    if (tipo === 'beep') {
      for(let i=0; i<5; i++) beep(880, now+i*0.3, 0.25);
    } else if (tipo === 'melodia') {
      beep(523, now, 0.2, 'sine'); beep(659, now+0.2, 0.2, 'sine');
      beep(784, now+0.4, 0.3, 'sine');
    } else if (tipo === 'sirene') {
      for(let i=0; i<10; i++) beep(400+i*80, now+i*0.1, 0.15, 'sawtooth', 0.4);
    } else if (tipo === 'sino') {
      beep(1200, now, 0.15, 'triangle', 0.6);
      beep(1000, now+0.15, 0.2, 'triangle', 0.5);
    } else if (tipo === 'vibracao') {
      beep(150, now, 0.8, 'square', 0.9);
      if (navigator.vibrate) navigator.vibrate([300,100,300]);
    } else if (tipo === 'eletronico') {
      beep(440, now, 0.1); beep(660, now+0.1, 0.1); beep(880, now+0.2, 0.2);
    }
  } catch(e) {}
}

// ============ NOTIFICAÇÃO ============
function mostrarNotificacao(nome, hora) {
  if ('Notification' in window && Notification.permission === 'granted') {
    new Notification('💊 HORA DO REMÉDIO!', {
      body: `${nome} - ${hora}`,
      icon: '💊',
      vibrate: [500,200,500,200,500],
      requireInteraction: true,
      tag: 'alarme-' + Date.now()
    });
  }
}

// ============ ALARME ============
function iniciarAlarme(nome, hora, id) {
  if (alarmeAtivo) return;
  
  alarmeAtivo = true;
  alarmeAtual = { id, nome, hora };
  
  // Tela cheia
  document.getElementById('alarmeTelaCheia').classList.add('ativo');
  document.getElementById('alarmeTelaCheiaNome').textContent = `💊 ${nome} - ${hora}`;
  
  // Alerta
  document.getElementById('alertaAlarme').style.display = 'block';
  document.getElementById('alertaAlarme').innerHTML = `🚨 ${nome} - ${hora} 🚨`;
  
  // Som
  function tocar() { tocarSom(somSelecionado); }
  tocar();
  intervaloAlarme = setInterval(tocar, 2000);
  
  // Notificação
  mostrarNotificacao(nome, hora);
  
  // Vibração
  if (navigator.vibrate) {
    navigator.vibrate([500,200,500,200,500]);
  }
  
  // Wake Lock
  if ('wakeLock' in navigator) {
    navigator.wakeLock.request('screen').catch(() => {});
  }
  
  // Histórico
  const agora = new Date();
  historicoAlarmes.push({
    nome, 
    data: agora.toLocaleDateString('pt-BR'),
    hora: agora.toLocaleTimeString('pt-BR'),
    timestamp: Date.now()
  });
  if (historicoAlarmes.length > 100) historicoAlarmes = historicoAlarmes.slice(-100);
  salvarTudo();
  
  atualizarStatus('🚨 ALARME: ' + nome + ' às ' + hora, 'status-erro');
}

function pararAlarme() {
  alarmeAtivo = false;
  alarmeAtual = null;
  
  if (intervaloAlarme) { clearInterval(intervaloAlarme); intervaloAlarme = null; }
  if (navigator.vibrate) navigator.vibrate(0);
  
  document.getElementById('alarmeTelaCheia').classList.remove('ativo');
  document.getElementById('alertaAlarme').style.display = 'none';
  
  atualizarStatus('✅ Alarme parado', 'status-ok');
}

// ============ VERIFICAÇÃO (CORRIGIDA PARA INTERVALO) ============
function verificarAlarmes() {
  if (alarmeAtivo) return;
  
  const agora = new Date();
  const horaAtual = String(agora.getHours()).padStart(2,'0')+':'+String(agora.getMinutes()).padStart(2,'0');
  const minutosAtual = agora.getHours() * 60 + agora.getMinutes();
  const dataAtual = agora.toDateString();
  
  console.log('🔍 Verificando:', horaAtual);
  
  lembretes.forEach(lembrete => {
    let deveAlarmar = false;
    let horaAlarme = '';
    
    // MODO FIXO
    if (!lembrete.intervalo && lembrete.hora === horaAtual) {
      deveAlarmar = true;
      horaAlarme = lembrete.hora;
    }
    
    // MODO INTERVALO (CORRIGIDO)
    if (lembrete.intervalo && lembrete.horaInicio) {
      const [hIni, mIni] = lembrete.horaInicio.split(':').map(Number);
      const minutosInicio = hIni * 60 + mIni;
      const intervaloMinutos = lembrete.intervalo * 60;
      
      // Calcular diferença desde o início
      let diferenca = minutosAtual - minutosInicio;
      
      // Se for negativo, significa que o horário de início é depois do horário atual
      // ou que passou da meia-noite
      if (diferenca < 0) {
        diferenca += 24 * 60; // Adiciona 24 horas em minutos
      }
      
      // Verificar se a diferença é múltiplo exato do intervalo
      if (diferenca >= 0 && diferenca % intervaloMinutos === 0) {
        deveAlarmar = true;
        horaAlarme = horaAtual;
        console.log('✅ Intervalo encontrado!', lembrete.nome, 'Diferença:', diferenca, 'min');
      }
    }
    
    if (deveAlarmar) {
      const chave = lembrete.id + '-' + dataAtual + '-' + horaAlarme;
      if (!ultimosAlarmesDisparados[chave]) {
        console.log('🚨 DISPARANDO:', lembrete.nome, horaAlarme);
        ultimosAlarmesDisparados[chave] = true;
        iniciarAlarme(lembrete.nome, horaAlarme, lembrete.id);
      }
    }
  });
  
  // Limpar chaves de dias anteriores
  for (let chave in ultimosAlarmesDisparados) {
    if (!chave.includes(dataAtual)) {
      delete ultimosAlarmesDisparados[chave];
    }
  }
}

// ============ RESUMO (MOSTRA TODOS OS HORÁRIOS) ============
function mostrarResumoAlarmeAtivo() { 
  if (alarmeAtual) mostrarResumo(alarmeAtual); 
}

function mostrarResumoLembrete(id) {
  const l = lembretes.find(x => x.id === id);
  if (l) mostrarResumo(l);
}

function mostrarResumo(dados) {
  const modal = document.getElementById('modalResumo');
  const conteudo = document.getElementById('conteudoResumo');
  const hoje = new Date().toLocaleDateString('pt-BR');
  const hist = historicoAlarmes.filter(h => h.nome === dados.nome).slice(-10).reverse();
  const tomadosHoje = historicoAlarmes.filter(h => h.nome === dados.nome && h.data === hoje).length;
  
  // Calcular todos os horários para intervalo
  let todosHorarios = [];
  if (dados.intervalo && dados.horaInicio) {
    const [h, m] = dados.horaInicio.split(':').map(Number);
    for (let i = 0; i < 24 / dados.intervalo; i++) {
      const totalMinutos = (h * 60 + m + i * dados.intervalo * 60) % (24 * 60);
      const hh = Math.floor(totalMinutos / 60);
      const mm = totalMinutos % 60;
      todosHorarios.push(String(hh).padStart(2,'0') + ':' + String(mm).padStart(2,'0'));
    }
  }
  
  conteudo.innerHTML = `
    <div class="destaque">
      ${alarmeAtivo ? '🚨 ALARME ATIVO! 🚨' : '📋 Detalhes do Lembrete'}
    </div>
    
    <div class="resumo-item">
      <span class="resumo-label">💊 Remédio:</span>
      <span class="resumo-valor">${dados.nome}</span>
    </div>
    
    <div class="resumo-item">
      <span class="resumo-label">🕐 Horário:</span>
      <span class="resumo-valor">${dados.intervalo ? dados.horaInicio + ' (início)' : dados.hora}</span>
    </div>
    
    ${dados.intervalo ? `
      <div class="resumo-item">
        <span class="resumo-label">⏱️ Intervalo:</span>
        <span class="resumo-valor">A cada ${dados.intervalo}h</span>
      </div>
      
      <div style="background:#f3e5f5; padding:15px; border-radius:10px; margin:10px 0;">
        <strong>📅 TODOS os horários do dia:</strong>
        <div class="horarios-intervalo" style="margin-top:8px;">
          ${todosHorarios.map(h => `
            <span class="horario-chip">${h}</span>
          `).join(' ')}
        </div>
      </div>
    ` : ''}
    
    <div class="resumo-item">
      <span class="resumo-label">🔊 Som:</span>
      <span class="resumo-valor">${dados.som || 'beep'}</span>
    </div>
    
    <div class="resumo-item">
      <span class="resumo-label">📊 Tomados hoje:</span>
      <span class="resumo-valor">${tomadosHoje}x</span>
    </div>
    
    ${hist.length > 0 ? `
      <div style="margin-top:10px;">
        <strong>📜 Últimos registros:</strong>
        <div class="historico-container">
          ${hist.map(h => `
            <div class="historico-item">
              <span>${h.data}</span>
              <span>${h.hora}</span>
            </div>
          `).join('')}
        </div>
      </div>
    ` : ''}
  `;
  
  document.getElementById('modalTitulo').textContent = alarmeAtivo ? '🚨 Alarme Ativo!' : '📋 ' + dados.nome;
  modal.classList.add('visivel');
}

function fecharResumo() { 
  document.getElementById('modalResumo').classList.remove('visivel'); 
}

// ============ CRUD ============
function adicionarLembrete() {
  const nome = document.getElementById('nomeRemedio').value.trim();
  if (!nome) return alert('⚠️ Digite o nome!');
  
  let hora, horaInicio = null, intervalo = null;
  
  if (modoAtual === 'fixo') {
    hora = document.getElementById('horaFixa').value;
    if (!hora) return alert('⚠️ Selecione o horário!');
  } else {
    horaInicio = document.getElementById('horaInicioIntervalo').value;
    if (!horaInicio) return alert('⚠️ Selecione o horário de início!');
    hora = horaInicio;
    intervalo = intervaloSelecionado;
  }
  
  lembretes.push({ 
    id: Date.now(), 
    nome, 
    hora, 
    horaInicio, 
    intervalo, 
    som: somSelecionado 
  });
  
  salvarTudo();
  atualizarLista();
  document.getElementById('nomeRemedio').value = '';
  atualizarStatus('✅ Lembrete salvo!', 'status-ok');
}

function editarLembrete(id) {
  const l = lembretes.find(x => x.id === id);
  if (!l) return;
  const nh = prompt('Novo horário (HH:MM):', l.horaInicio || l.hora);
  if (nh && /^\d{2}:\d{2}$/.test(nh)) {
    if (l.intervalo) { l.horaInicio = nh; l.hora = nh; }
    else l.hora = nh;
    salvarTudo();
    atualizarLista();
  }
}

function removerLembrete(id) {
  if (confirm('Remover?')) {
    lembretes = lembretes.filter(l => l.id !== id);
    salvarTudo();
    atualizarLista();
  }
}

function limparTodos() {
  if (confirm('Remover TODOS?')) {
    lembretes = [];
    salvarTudo();
    atualizarLista();
    pararAlarme();
  }
}

// ============ INTERFACE ============
function atualizarLista() {
  const div = document.getElementById('listaLembretes');
  document.getElementById('contador').textContent = '(' + lembretes.length + ')';
  
  if (!lembretes.length) {
    div.innerHTML = '<p style="color:#999;">Nenhum lembrete</p>';
    return;
  }
  
  lembretes.sort((a, b) => a.hora.localeCompare(b.hora));
  
  div.innerHTML = lembretes.map(l => `
    <div class="lembrete-card" onclick="mostrarResumoLembrete(${l.id})">
      <div class="lembrete-info">
        <h4>💊 ${l.nome} ${l.intervalo ? '🔁' : ''}</h4>
        ${l.intervalo ? 
          `<span class="lembrete-hora">🕐 Início: ${l.horaInicio}</span><span class="lembrete-hora">⏱️ A cada ${l.intervalo}h</span>` :
          `<span class="lembrete-hora">🕒 ${l.hora}</span>`
        }
        <span class="lembrete-hora">🔊 ${l.som}</span>
      </div>
      <div class="lembrete-acoes">
        <button class="btn-pequeno btn-editar" onclick="event.stopPropagation(); editarLembrete(${l.id})">✏️</button>
        <button class="btn-pequeno btn-excluir" onclick="event.stopPropagation(); removerLembrete(${l.id})">🗑️</button>
      </div>
    </div>
  `).join('');
}

function mudarModo(m) {
  modoAtual = m;
  document.getElementById('modoFixo').classList.toggle('ativo', m==='fixo');
  document.getElementById('modoIntervalo').classList.toggle('ativo', m==='intervalo');
  document.getElementById('painelFixo').classList.toggle('visivel', m==='fixo');
  document.getElementById('painelIntervalo').classList.toggle('visivel', m==='intervalo');
}

function selecionarIntervalo(h, btn) {
  intervaloSelecionado = h;
  document.querySelectorAll('.intervalo-btn').forEach(b => b.classList.remove('ativo'));
  btn.classList.add('ativo');
  atualizarPreviewIntervalo();
}

function atualizarPreviewIntervalo() {
  const hi = document.getElementById('horaInicioIntervalo').value;
  if (hi && intervaloSelecionado) {
    const [h, m] = hi.split(':').map(Number);
    const totalHorarios = Math.floor(24 / intervaloSelecionado);
    const horarios = [];
    
    for (let i = 0; i < totalHorarios; i++) {
      const totalMinutos = (h * 60 + m + i * intervaloSelecionado * 60) % (24 * 60);
      const hh = Math.floor(totalMinutos / 60);
      const mm = totalMinutos % 60;
      horarios.push(String(hh).padStart(2,'0') + ':' + String(mm).padStart(2,'0'));
    }
    
    document.getElementById('infoProximoAlarme').style.display = 'block';
    document.getElementById('infoProximoAlarme').innerHTML = 
      `📅 ${totalHorarios} alarmes por dia: <strong>${horarios.join(' → ')}</strong>`;
    
    // Mostrar chips com todos os horários
    const chipsDiv = document.getElementById('todosHorarios');
    chipsDiv.style.display = 'flex';
    chipsDiv.innerHTML = horarios.map(h => 
      `<span class="horario-chip">${h}</span>`
    ).join('');
  }
}

function selecionarSom(s, btn) {
  somSelecionado = s;
  document.querySelectorAll('.som-btn').forEach(b => b.classList.remove('ativo'));
  btn.classList.add('ativo');
}

function testarSom() { tocarSom(somSelecionado); }

function testarAlarmeAgora() {
  if (Notification.permission !== 'granted') Notification.requestPermission();
  iniciarAlarme('🧪 TESTE', new Date().toLocaleTimeString(), 'teste');
}

function atualizarStatus(msg, cls) {
  document.getElementById('statusSistema').textContent = msg;
  document.getElementById('statusSistema').className = 'status-badge ' + cls;
}

// ============ INICIAR ============
function iniciar() {
  carregarTudo();
  
  const agora = new Date();
  const h = String(agora.getHours()).padStart(2,'0')+':'+String(agora.getMinutes()).padStart(2,'0');
  document.getElementById('horaFixa').value = h;
  document.getElementById('horaInicioIntervalo').value = h;
  
  Notification.requestPermission();
  atualizarLista();
  
  // Verificar a cada 30 segundos
  setInterval(verificarAlarmes, 30000);
  verificarAlarmes();
  
  document.getElementById('modalResumo').addEventListener('click', function(e) {
    if (e.target === this) fecharResumo();
  });
  
  if ('wakeLock' in navigator) {
    setInterval(() => { navigator.wakeLock.request('screen').catch(() => {}); }, 60000);
  }
  
  atualizarStatus('✅ ' + lembretes.length + ' lembrete(s) carregado(s)!', 'status-ok');
}

iniciar();
</script>
</body>
